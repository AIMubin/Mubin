name: H3.9.2 post-consolidation preparation

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: engines/hadith/qualification/H3.9.2
    env:
      CUMULATIVE_ARTIFACT_DIR: /tmp/h392-postconsolidation/cumulative-artifact
      CUMULATIVE_DIR: /tmp/h392-postconsolidation/cumulative-source-bearing
      PRIVATE_DIR: /tmp/h392-postconsolidation/private
      PUBLIC_DIR: /tmp/h392-postconsolidation/public

    steps:
      - name: Checkout Mubin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refuse stale or non-main dispatch
        run: |
          set -eu
          if [ "${GITHUB_REF_NAME:-}" != "main" ]; then
            echo "Post-consolidation preparation must be dispatched from main." >&2
            exit 1
          fi
          current="$(git rev-parse HEAD)"
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$latest"
          if [ "$current" != "$latest" ]; then
            echo "Refusing stale post-consolidation preparation; dispatch from current main." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engines/hadith/qualification/H3.9.2/requirements.txt

      - name: Install campaign dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate frozen post-consolidation state
        env:
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -eu
          test -n "$ARTIFACT_KEY"
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("artifacts/H3.9.2-STATUS.json").read_text(encoding="utf-8")
          )
          prep = status["postconsolidation_preparation"]
          completed = status["last_completed_cumulative_consolidation"]

          if int(status.get("freeze_schema_version", 0)) != 26:
              raise SystemExit("post-consolidation preparation requires freeze schema 26")
          if status.get("reserve_reconciliation_enabled") is not False:
              raise SystemExit("reserve reconciliation must remain disabled")
          if prep.get("ready") is not True or prep.get("completed") is not False:
              raise SystemExit("post-consolidation preparation is not in ready state")
          if int(prep.get("protocol_freeze_schema", 0)) != 26:
              raise SystemExit("post-consolidation protocol schema mismatch")
          if int(prep.get("source_cumulative_freeze_schema", 0)) != 25:
              raise SystemExit("source cumulative evidence must be schema 25")
          if int(prep.get("expected_primary_task_count", 0)) != 210:
              raise SystemExit("post-consolidation preparation requires 210 primary tasks")
          if int(prep.get("expected_pending_adjudication_count", -1)) != 129:
              raise SystemExit("post-consolidation adjudication count mismatch")
          if int(prep.get("expected_authorized_reserve_count", -1)) != 41:
              raise SystemExit("post-consolidation reserve count mismatch")
          if prep.get("reserve_reconciliation_enabled") is not False:
              raise SystemExit("preparation must not enable reserve reconciliation")
          if prep.get("adjudication_execution_enabled") is not False:
              raise SystemExit("preparation must not enable adjudication execution")

          evidence_path = prep.get("source_cumulative_evidence_path")
          if evidence_path != "artifacts/CUMULATIVE_PRIMARY_EVIDENCE_210.json":
              raise SystemExit("unexpected cumulative control evidence path")
          control = json.loads(Path(evidence_path).read_text(encoding="utf-8"))
          if completed.get("evidence_path") != evidence_path:
              raise SystemExit("last completed cumulative evidence path mismatch")
          if int(completed.get("successful_run_id", 0)) != int(prep["source_cumulative_run_id"]):
              raise SystemExit("source cumulative run differs from completed state")
          if control.get("workflow", {}).get("run_id") != completed["successful_run_id"]:
              raise SystemExit("cumulative control run differs from status")
          if control.get("bindings", {}).get("cumulative_ledger_sha256") != completed.get(
              "cumulative_ledger_sha256"
          ):
              raise SystemExit("cumulative ledger binding differs from status")
          if control.get("bindings", {}).get("replacement_eligibility_sha256") != completed.get(
              "replacement_eligibility_sha256"
          ):
              raise SystemExit("replacement eligibility binding differs from status")
          PY

      - name: Fetch and verify frozen cumulative artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rm -rf "$CUMULATIVE_ARTIFACT_DIR"
          mkdir -p "$CUMULATIVE_ARTIFACT_DIR"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          root = Path(os.environ["CUMULATIVE_ARTIFACT_DIR"])
          status = json.loads(
              Path("artifacts/H3.9.2-STATUS.json").read_text(encoding="utf-8")
          )
          completed = status["last_completed_cumulative_consolidation"]
          control = json.loads(
              Path(completed["evidence_path"]).read_text(encoding="utf-8")
          )

          run_id = int(completed["successful_run_id"])
          artifact_id = int(completed["artifact_id"])
          expected_zip = str(completed["artifact_digest"])
          if not expected_zip.startswith("sha256:"):
              raise SystemExit("completed cumulative artifact digest is invalid")

          def request(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "mubin-h392-postconsolidation",
                  },
              )
              return urllib.request.urlopen(req, timeout=120)

          def api_json(url):
              with request(url) as response:
                  return json.load(response)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def artifact_download_location(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "mubin-h392-postconsolidation",
                  },
              )
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(req, timeout=120):
                      raise SystemExit("artifact endpoint unexpectedly returned a body")
              except urllib.error.HTTPError as exc:
                  if exc.code not in {301, 302, 303, 307, 308}:
                      raise
                  location = exc.headers.get("Location")
              if not location:
                  raise SystemExit("artifact endpoint returned no redirect location")
              parsed = urllib.parse.urlparse(location)
              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.username
                  or parsed.password
              ):
                  raise SystemExit("artifact redirect is not a safe HTTPS URL")
              return location

          run = api_json(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("frozen cumulative run is not completed/success")
          if int(run.get("run_attempt", 0)) != 1:
              raise SystemExit("frozen cumulative run must be attempt 1")
          if run.get("head_branch") != "main":
              raise SystemExit("frozen cumulative run is not a main-branch run")
          if run.get("path") != ".github/workflows/h392-cumulative-consolidation.yml":
              raise SystemExit("frozen cumulative run workflow path mismatch")
          if run.get("head_sha") != control.get("runner_commit"):
              raise SystemExit("frozen cumulative run commit differs from control record")

          artifact = api_json(
              f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}"
          )
          if artifact.get("expired") is True:
              raise SystemExit("frozen cumulative artifact is expired")
          if artifact.get("name") != "h392-cumulative-primary-evidence":
              raise SystemExit("frozen cumulative artifact name mismatch")
          artifact_run = artifact.get("workflow_run")
          if not isinstance(artifact_run, dict) or int(artifact_run.get("id", 0)) != run_id:
              raise SystemExit("frozen cumulative artifact is not owned by the bound run")
          if artifact_run.get("head_sha") != run.get("head_sha"):
              raise SystemExit("frozen cumulative artifact head SHA differs from the bound run")
          if artifact.get("digest") != expected_zip:
              raise SystemExit("GitHub cumulative artifact digest differs from frozen status")

          archive = root / "artifact.zip"
          location = artifact_download_location(str(artifact["archive_download_url"]))
          unauthenticated = urllib.request.Request(
              location,
              headers={"User-Agent": "mubin-h392-postconsolidation"},
          )
          with urllib.request.urlopen(unauthenticated, timeout=120) as response:
              archive.write_bytes(response.read())
          actual_zip = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual_zip != expected_zip.split(":", 1)[1]:
              raise SystemExit("downloaded cumulative artifact ZIP digest mismatch")

          extracted = root / "extracted"
          extracted.mkdir()
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  p = Path(info.filename)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if p.is_absolute() or ".." in p.parts or stat.S_ISLNK(mode):
                      raise SystemExit(f"unsafe cumulative ZIP member: {info.filename}")
              zf.extractall(extracted)

          summaries = list(extracted.rglob("CUMULATIVE_SUMMARY.json"))
          bundles = list(extracted.rglob("h392-cumulative-source-bearing.tar.gz.aesgcm"))
          bundle_hashes = list(extracted.rglob("ENCRYPTED_CUMULATIVE_BUNDLE_SHA256.txt"))
          if len(summaries) != 1 or len(bundles) != 1 or len(bundle_hashes) != 1:
              raise SystemExit("unexpected frozen cumulative artifact layout")
          if len([p for p in extracted.rglob("*") if p.is_file()]) != 3:
              raise SystemExit("frozen cumulative artifact contains unexpected files")

          expected_summary = str(control["artifact"]["redacted_summary_sha256"])
          actual_summary = hashlib.sha256(summaries[0].read_bytes()).hexdigest()
          if actual_summary != expected_summary:
              raise SystemExit("frozen cumulative summary digest mismatch")

          expected_bundle = str(control["artifact"]["encrypted_bundle_sha256"])
          actual_bundle = hashlib.sha256(bundles[0].read_bytes()).hexdigest()
          declared_bundle = bundle_hashes[0].read_text(encoding="utf-8").strip()
          if actual_bundle != expected_bundle or declared_bundle != expected_bundle:
              raise SystemExit("frozen cumulative encrypted-bundle digest mismatch")

          shutil.copy2(summaries[0], root / "CUMULATIVE_SUMMARY.json")
          shutil.copy2(
              bundles[0],
              root / "h392-cumulative-source-bearing.tar.gz.aesgcm",
          )
          shutil.copy2(
              bundle_hashes[0],
              root / "ENCRYPTED_CUMULATIVE_BUNDLE_SHA256.txt",
          )
          shutil.rmtree(extracted)
          archive.unlink()
          PY

      - name: Decrypt frozen cumulative source-bearing evidence
        env:
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -eu
          rm -rf "$CUMULATIVE_DIR"
          mkdir -p "$CUMULATIVE_DIR"
          python - <<'PY'
          import os
          from pathlib import Path
          import tarfile

          from benchmark_campaign.artifact_crypto import decrypt_file

          artifact_dir = Path(os.environ["CUMULATIVE_ARTIFACT_DIR"])
          out = Path(os.environ["CUMULATIVE_DIR"])
          archive = artifact_dir / "source-bearing.tar.gz"
          decrypt_file(
              artifact_dir / "h392-cumulative-source-bearing.tar.gz.aesgcm",
              archive,
              os.environ["ARTIFACT_KEY"],
          )
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              for member in members:
                  p = Path(member.name)
                  if (
                      p.is_absolute()
                      or ".." in p.parts
                      or member.issym()
                      or member.islnk()
                      or member.isdev()
                  ):
                      raise SystemExit(f"unsafe cumulative tar member: {member.name}")
              tf.extractall(out, members=members, filter="data")
          archive.unlink()

          for name in (
              "CUMULATIVE_MANIFEST.json",
              "CUMULATIVE_LEDGER.jsonl",
              "CUMULATIVE_ADJUDICATION.jsonl",
              "REPLACEMENT_ELIGIBILITY.json",
          ):
              if not (out / name).is_file():
                  raise SystemExit(f"decrypted cumulative bundle missing {name}")
          PY

      - name: Prepare opaque post-consolidation identity bindings
        env:
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -eu
          rm -rf "$PUBLIC_DIR" "$PRIVATE_DIR"
          python -m benchmark_campaign prepare-postconsolidation             --cumulative-dir "$CUMULATIVE_DIR"             --control-evidence artifacts/CUMULATIVE_PRIMARY_EVIDENCE_210.json             --public-out-dir "$PUBLIC_DIR"             --private-out-dir "$PRIVATE_DIR"             --commitment-secret-env ARTIFACT_KEY             > "$RUNNER_TEMP/h392-postconsolidation-report.json"

      - name: Encrypt private post-consolidation identity map
        env:
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -eu
          tar -C "$PRIVATE_DIR" -czf "$RUNNER_TEMP/h392-postconsolidation-private.tar.gz" .
          python -m benchmark_campaign.artifact_crypto encrypt             --input "$RUNNER_TEMP/h392-postconsolidation-private.tar.gz"             --output "$PUBLIC_DIR/h392-postconsolidation-private.tar.gz.aesgcm"             --passphrase-env ARTIFACT_KEY
          sha256sum "$PUBLIC_DIR/h392-postconsolidation-private.tar.gz.aesgcm"             | awk '{print $1}'             > "$PUBLIC_DIR/ENCRYPTED_POSTCONSOLIDATION_PRIVATE_SHA256.txt"
          rm -f "$RUNNER_TEMP/h392-postconsolidation-private.tar.gz"

      - name: Remove plaintext and prove upload is redacted
        run: |
          set -eu
          rm -rf "$CUMULATIVE_DIR" "$PRIVATE_DIR" "$CUMULATIVE_ARTIFACT_DIR"
          test -s "$PUBLIC_DIR/POSTCONSOLIDATION_BINDING.json"
          test -s "$PUBLIC_DIR/POSTCONSOLIDATION_SUMMARY.json"
          test -s "$PUBLIC_DIR/h392-postconsolidation-private.tar.gz.aesgcm"
          test -s "$PUBLIC_DIR/ENCRYPTED_POSTCONSOLIDATION_PRIVATE_SHA256.txt"
          test "$(find "$PUBLIC_DIR" -mindepth 1 -maxdepth 1 | wc -l)" -eq 4
          test "$(find "$PUBLIC_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4
          test ! -e "$PUBLIC_DIR/PRIVATE_MANIFEST.json"
          test ! -e "$PUBLIC_DIR/RESERVE_AUTHORIZATION_PRIVATE.json"
          test ! -e "$PUBLIC_DIR/ADJUDICATION_QUEUE_PRIVATE.jsonl"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          public = Path(os.environ["PUBLIC_DIR"])
          binding = json.loads(
              (public / "POSTCONSOLIDATION_BINDING.json").read_text(encoding="utf-8")
          )
          summary = json.loads(
              (public / "POSTCONSOLIDATION_SUMMARY.json").read_text(encoding="utf-8")
          )
          for obj in (binding, summary):
              for flag in (
                  "contains_task_ids",
                  "contains_slot_ids",
                  "contains_source_text",
                  "contains_gold_payloads",
                  "contains_model_identity",
              ):
                  if obj.get(flag) is not False:
                      raise SystemExit(f"public post-consolidation output is not redacted: {flag}")
              if obj.get("reserve_reconciliation_enabled") is not False:
                  raise SystemExit("preparation output unexpectedly enables reserves")
              if obj.get("adjudication_execution_enabled") is not False:
                  raise SystemExit("preparation output unexpectedly enables adjudication")
          leaves = binding["reserve"]["commitment_leaf_sha256"]
          adjudication = binding["adjudication"]["commitment_leaf_sha256"]
          if len(leaves) != 41 or len(adjudication) != 129:
              raise SystemExit("public commitment cardinality mismatch")
          if any(len(value) != 64 for value in leaves + adjudication):
              raise SystemExit("public commitment leaf is not a SHA-256 digest")
          PY
          expected="$(cat "$PUBLIC_DIR/ENCRYPTED_POSTCONSOLIDATION_PRIVATE_SHA256.txt")"
          actual="$(sha256sum "$PUBLIC_DIR/h392-postconsolidation-private.tar.gz.aesgcm" | awk '{print $1}')"
          test "$expected" = "$actual"

      - name: Reconfirm main before publishing post-consolidation preparation
        run: |
          set -eu
          current="$(git rev-parse HEAD)"
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$latest"
          if [ "$current" != "$latest" ]; then
            echo "Main advanced before post-consolidation publication; refusing stale artifact." >&2
            exit 1
          fi

      - name: Show redacted preparation summary
        run: |
          {
            echo '### H3.9.2 post-consolidation preparation'
            echo '~~~json'
            cat "$PUBLIC_DIR/POSTCONSOLIDATION_SUMMARY.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted bindings and encrypted private map
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h392-postconsolidation-preparation
          path: /tmp/h392-postconsolidation/public
          if-no-files-found: error
          retention-days: 30
