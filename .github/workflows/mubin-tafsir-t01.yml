name: Mubin Tafsir T0.1 source-linked read path

on:
  pull_request:
    paths:
      - "engines/tafsir/**"
      - "README.md"
      - "corpus/query.py"
      - "corpus/locks/quran-tafsir-q03.json"
      - "core/tests/test_tafsir_t01.py"
      - "core/tests/test_tafsir_t02.py"
      - "core/tests/test_tafsir_t023.py"
      - "core/tests/test_tafsir_t03.py"
      - "core/tests/test_usul_ut014.py"
      - "engines/hadith/hsearch/**"
      - "core/tests/test_hadith_hsearch01.py"
      - "core/tests/test_hsearch_alignment.py"
      - "core/tests/test_hsearch_diagnostics.py"
      - "evaluation/evidence/hsearch01_case_b_reference.json"
      - "engines/quran/q01c/**"
      - "core/tests/test_quran_q01c.py"
      - "corpus/tests/test_query.py"
      - "core/tests/test_quran_tafsir_metadata.py"
      - ".github/workflows/mubin-tafsir-t01.yml"
  push:
    branches: [main]
    paths:
      - "engines/tafsir/**"
      - "README.md"
      - "corpus/query.py"
      - "corpus/locks/quran-tafsir-q03.json"
      - "core/tests/test_tafsir_t01.py"
      - "core/tests/test_tafsir_t02.py"
      - "core/tests/test_tafsir_t023.py"
      - "core/tests/test_tafsir_t03.py"
      - "core/tests/test_usul_ut014.py"
      - "engines/hadith/hsearch/**"
      - "core/tests/test_hadith_hsearch01.py"
      - "core/tests/test_hsearch_alignment.py"
      - "core/tests/test_hsearch_diagnostics.py"
      - "evaluation/evidence/hsearch01_case_b_reference.json"
      - "engines/quran/q01c/**"
      - "core/tests/test_quran_q01c.py"
      - "corpus/tests/test_query.py"
      - "core/tests/test_quran_tafsir_metadata.py"
      - ".github/workflows/mubin-tafsir-t01.yml"

permissions:
  contents: read

jobs:
  tafsir-source-linkage:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q engines/tafsir core/tests/test_tafsir_t01.py core/tests/test_tafsir_t02.py core/tests/test_tafsir_t023.py core/tests/test_tafsir_t03.py core/tests/test_hadith_hsearch01.py core/tests/test_hsearch_alignment.py core/tests/test_hsearch_diagnostics.py
      - run: python -m unittest core.tests.test_tafsir_t01 core.tests.test_tafsir_t02 core.tests.test_tafsir_t023 core.tests.test_tafsir_t03 core.tests.test_hadith_hsearch01 core.tests.test_hsearch_alignment core.tests.test_hsearch_diagnostics core.tests.test_quran_q01c corpus.tests.test_query core.tests.test_quran_tafsir_metadata -v
