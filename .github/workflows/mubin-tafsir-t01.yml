name: Mubin Tafsir T0.1 source-linked read path

on:
  pull_request:
    paths:
      - "engines/tafsir/**"
      - "corpus/query.py"
      - "corpus/locks/quran-tafsir-q03.json"
      - "core/tests/test_tafsir_t01.py"
      - "corpus/tests/test_query.py"
      - "core/tests/test_quran_tafsir_metadata.py"
      - ".github/workflows/mubin-tafsir-t01.yml"
  push:
    branches: [main]
    paths:
      - "engines/tafsir/**"
      - "corpus/query.py"
      - "corpus/locks/quran-tafsir-q03.json"
      - "core/tests/test_tafsir_t01.py"
      - "corpus/tests/test_query.py"
      - "core/tests/test_quran_tafsir_metadata.py"
      - ".github/workflows/mubin-tafsir-t01.yml"

permissions:
  contents: read

jobs:
  tafsir-source-linkage:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q engines/tafsir core/tests/test_tafsir_t01.py
      - run: python -m unittest core.tests.test_tafsir_t01 corpus.tests.test_query core.tests.test_quran_tafsir_metadata -v
