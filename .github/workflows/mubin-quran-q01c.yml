name: Mubin Quran Q0.1c loopback reader offline

on:
  pull_request:
    paths:
      - "engines/quran/q01c/**"
      - "core/tests/test_quran_q01c.py"
      - "docs/research/QURAN-Q01C-**"
      - "docs/reviews/QURAN-Q01C-**"
      - ".github/workflows/mubin-quran-q01c.yml"
  push:
    branches: [main]
    paths:
      - "engines/quran/q01c/**"
      - "core/tests/test_quran_q01c.py"
      - "docs/research/QURAN-Q01C-**"
      - "docs/reviews/QURAN-Q01C-**"
      - ".github/workflows/mubin-quran-q01c.yml"

permissions:
  contents: read

jobs:
  localhost-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q engines/quran/q01c engines/quran/q01b core/tests
      - run: python -m engines.quran.q01c --help
      - run: python -m unittest discover -s core/tests -v
