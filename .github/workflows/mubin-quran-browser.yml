name: Mubin Quran actual Chrome browser smoke

on:
  pull_request:
    paths:
      - "engines/quran/q01c/**"
      - "engines/quran/q01b/**"
      - "qa/quran_browser_smoke.py"
      - ".github/workflows/mubin-quran-browser.yml"
      - "docs/reviews/QURAN-BROWSER-**"
  push:
    branches: [main]
    paths:
      - "engines/quran/q01c/**"
      - "engines/quran/q01b/**"
      - "qa/quran_browser_smoke.py"
      - ".github/workflows/mubin-quran-browser.yml"

permissions:
  contents: read

jobs:
  headless-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - name: Confirm actual Chrome and matching driver
        run: |
          command -v google-chrome
          command -v chromedriver
          google-chrome --version
          chromedriver --version
      - name: Real browser + live loopback HTTP, synthetic text only
        run: python -m qa.quran_browser_smoke
