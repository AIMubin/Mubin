name: Mubin review harness R1 (untrusted intake)

on:
  pull_request:
    paths:
      - "core/review_harness/**"
      - "core/tests/test_review_harness_v01.py"
      - "schemas/review-harness-v01.schema.json"
      - "research/review_harness/**"
      - "docs/research/REVIEW-HARNESS-R1.md"
      - "docs/reviews/REVIEW-HARNESS-R1-AUDIT.md"
      - ".github/workflows/mubin-review-harness-r1.yml"
  push:
    branches: [main]
    paths:
      - "core/review_harness/**"
      - "core/tests/test_review_harness_v01.py"
      - "schemas/review-harness-v01.schema.json"
      - "research/review_harness/**"
      - "docs/research/REVIEW-HARNESS-R1.md"
      - "docs/reviews/REVIEW-HARNESS-R1-AUDIT.md"
      - ".github/workflows/mubin-review-harness-r1.yml"

permissions:
  contents: read

jobs:
  safe-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q core/review_harness core/tests/test_review_harness_v01.py
      - run: python -m unittest discover -s core/tests -p 'test_review_harness_v01.py' -v
      - run: python -m core.review_harness research/review_harness/review-packet.example.json --mode plan --json
      - run: python -m core.review_harness research/review_harness/review-packet.example.json --json
      - run: python -m unittest discover -s core/tests -v
