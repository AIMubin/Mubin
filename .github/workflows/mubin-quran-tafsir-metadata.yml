name: Mubin Quran tafsir bibliography (metadata-only)

on:
  pull_request:
    paths:
      - "engines/quran/tafsir/**"
      - "engines/quran/q01c/reader.py"
      - "engines/quran/q01c/reader.js"
      - "engines/quran/q01c/reader.html"
      - "engines/quran/q01c/reader.css"
      - "schemas/quran-tafsir-source-v01.schema.json"
      - "core/tests/test_quran_tafsir_metadata.py"
      - "docs/research/QURAN-TAFSIR-METADATA-REGISTRY.md"
      - "docs/reviews/QURAN-TAFSIR-METADATA-AUDIT.md"
      - ".github/workflows/mubin-quran-tafsir-metadata.yml"
  push:
    branches: [main]
    paths:
      - "engines/quran/tafsir/**"
      - "engines/quran/q01c/reader.py"
      - "engines/quran/q01c/reader.js"
      - "engines/quran/q01c/reader.html"
      - "engines/quran/q01c/reader.css"
      - "schemas/quran-tafsir-source-v01.schema.json"
      - "core/tests/test_quran_tafsir_metadata.py"
      - ".github/workflows/mubin-quran-tafsir-metadata.yml"

permissions:
  contents: read

jobs:
  catalog-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q engines/quran/tafsir core/tests/test_quran_tafsir_metadata.py
      - run: python -m unittest core.tests.test_quran_tafsir_metadata -v
      - run: node --check engines/quran/q01c/reader.js

  pinned-mirror-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - name: Fetch exact pinned unverified third-party mirror into ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --max-time 45 --max-filesize 4194304 \
            'https://raw.githubusercontent.com/acfatah/tanzil/052b515f3a24dfacbe4cafc3b89f0681a447f462/data/quran-uthmani.txt' \
            --output "${RUNNER_TEMP}/q01f-unverified.txt"
      - name: Verify fixed bytes and optional local-only tafsir metadata API
        shell: bash
        run: |
          python - "${RUNNER_TEMP}/q01f-unverified.txt" <<'PY'
          import json,sys,threading
          from pathlib import Path
          from urllib.request import urlopen
          from engines.quran.q01b.tanzil import load_raw
          from engines.quran.q01c.reader import build_http_server

          raw=Path(sys.argv[1]).read_bytes()
          manifest=Path("engines/quran/q01b/sources/tanzil-mirror-v1.1.json").read_bytes()
          idx=load_raw(manifest,raw)
          assert len(idx.verses)==6236 and idx.report()["source_authenticated"] is False
          server=build_http_server(idx,raw,port=0)
          worker=threading.Thread(target=server.serve_forever,daemon=True)
          worker.start()
          try:
              with urlopen(f"http://127.0.0.1:{server.server_port}/api/tafsir-catalog?ref=2%3A1",timeout=10) as r:
                  result=json.load(r)
              assert len(result["sources"])==6
              assert result["reference"]=="2:1"
              assert result["rights_verified"] is False
              assert result["edition_verified"] is False
              assert result["p1_admitted"] is False
              assert result["text_import_allowed"] is False
              assert result["ai_tafsir_generated"] is False
              assert result["links"]["choose_tafsir"]=="https://quran.ksu.edu.sa/index.php#aya=2_1&m=hafs"
              assert result["links"]["muyassar"]=="https://quran.ksu.edu.sa/index.php#aya=2_1&m=hafs&qaree=husary&trans=ar_mu"
              assert all(s["edition"] is None and not s["text_ingested"] and not s["p1_eligible"] for s in result["sources"])
              print("PASS: 6236 pinned mirror records / 6 metadata-only references / no text import or authority")
          finally:
              server.shutdown()
              server.server_close()
              worker.join(timeout=3)
          PY
