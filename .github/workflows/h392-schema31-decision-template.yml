name: H3.9.2 Schema-31 decision template migration

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      WORK_ROOT: /tmp/h392-schema31-template
      PACKET_ROOT: /tmp/h392-schema31-template/schema30-packet
      TEMPLATE_ROOT: /tmp/h392-schema31-template/schema31-template
      REDACTED_ROOT: /tmp/h392-schema31-template/redacted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engines/hadith/qualification/H3.9.2/requirements.txt
      - run: python -m pip install -r engines/hadith/qualification/H3.9.2/requirements.txt

      - name: Validate Schema-31 migration target
        env:
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME:-}" = "main"
          test -n "$ARTIFACT_KEY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("engines/hadith/qualification/H3.9.2/artifacts/H3.9.2-STATUS.json").read_text())
          if s.get("freeze_schema_version") != 31:
              raise SystemExit("Schema-31 decision template migration requires repository freeze schema 31")
          t=s.get("adjudication_decision_template_target",{})
          if t.get("ready") is not True or t.get("completed") is not False:
              raise SystemExit("Schema-31 decision template target is not open")
          if t.get("workflow") != ".github/workflows/h392-schema31-decision-template.yml":
              raise SystemExit("Schema-31 decision template workflow binding mismatch")
          if t.get("expected_case_count") != 158:
              raise SystemExit("Schema-31 decision template count must be 158")
          if t.get("source_packet_artifact_id") != 11526263194:
              raise SystemExit("Schema-30 packet artifact binding mismatch")
          if t.get("source_packet_sha256") != "44df7e629adb56a8a822a08de95f1025f439db40cd7a3501028be114b2c5eb27":
              raise SystemExit("Schema-30 packet SHA binding mismatch")
          surface=s.get("adjudication_review_surface",{})
          if surface.get("human_review_authorized") is not False:
              raise SystemExit("human review must remain closed before Schema-31 template freeze")
          if surface.get("decision_ingestion_authorized") is not False:
              raise SystemExit("decision ingestion must remain disabled")
          if s.get("post_consolidation_protocol",{}).get("automatic_reserve3_authorized") is not False:
              raise SystemExit("reserve:03 must remain unauthorized")
          PY

      - name: Download and decrypt exact Schema-30 packet artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT" "$PACKET_ROOT" "$TEMPLATE_ROOT" "$REDACTED_ROOT"
          cd engines/hadith/qualification/H3.9.2
          python - <<'PY'
          import hashlib, json, os, pathlib, tarfile, urllib.error, urllib.request, urllib.parse, zipfile
          from benchmark_campaign.artifact_crypto import decrypt_file

          root=pathlib.Path(".")
          status=json.loads((root/"artifacts/H3.9.2-STATUS.json").read_text())
          t=status["adjudication_decision_template_target"]
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          key=os.environ["ARTIFACT_KEY"]
          work=pathlib.Path(os.environ["WORK_ROOT"])
          packet_root=pathlib.Path(os.environ["PACKET_ROOT"])

          def req(url):
              return urllib.request.Request(url,headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"mubin-h392-schema31-template",
              })
          def api(url):
              with urllib.request.urlopen(req(url),timeout=120) as r:
                  return json.load(r)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  return None
          def download(meta,dest):
              try:
                  urllib.request.build_opener(NR).open(req(meta["archive_download_url"]),timeout=120)
              except urllib.error.HTTPError as e:
                  if e.code not in (301,302,303,307,308):
                      raise
                  loc=e.headers.get("Location")
              else:
                  raise SystemExit("artifact endpoint did not redirect")
              if not loc:
                  raise SystemExit("artifact redirect missing")
              p=urllib.parse.urlparse(loc)
              if p.scheme!="https" or not p.hostname or p.username or p.password:
                  raise SystemExit("unsafe artifact redirect")
              with urllib.request.urlopen(
                  urllib.request.Request(loc,headers={"User-Agent":"mubin-h392-schema31-template"}),
                  timeout=120,
              ) as r:
                  dest.write_bytes(r.read())
          def safe_unzip(path,dest):
              with zipfile.ZipFile(path) as z:
                  for info in z.infolist():
                      target=(dest/info.filename).resolve()
                      if dest.resolve() not in target.parents and target!=dest.resolve():
                          raise SystemExit("unsafe ZIP path")
                  z.extractall(dest)
          def safe_untar(path,dest):
              with tarfile.open(path,"r:gz") as tfile:
                  for member in tfile.getmembers():
                      target=(dest/member.name).resolve()
                      if dest.resolve() not in target.parents and target!=dest.resolve():
                          raise SystemExit("unsafe TAR path")
                  tfile.extractall(dest)

          aid=int(t["source_packet_artifact_id"])
          meta=api(f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}")
          if (
              meta.get("expired") is True
              or meta.get("name") != t["source_packet_artifact_name"]
              or meta.get("digest") != t["source_packet_artifact_digest"]
              or int(meta.get("size_in_bytes",-1)) != int(t["source_packet_artifact_size_bytes"])
          ):
              raise SystemExit("Schema-30 packet artifact metadata mismatch")
          z=work/"schema30-artifact.zip"
          download(meta,z)
          expected_zip=t["source_packet_artifact_digest"].removeprefix("sha256:")
          if hashlib.sha256(z.read_bytes()).hexdigest()!=expected_zip:
              raise SystemExit("Schema-30 packet artifact ZIP digest mismatch")
          raw=work/"schema30-artifact"
          raw.mkdir()
          safe_unzip(z,raw)
          files={p.name:p for p in raw.iterdir() if p.is_file()}
          expected={
              "ADJUDICATION_PACKET_SUMMARY.json",
              "ENCRYPTED_ADJUDICATION_PACKET_SHA256.txt",
              "h392-adjudication-packet-source-bearing.tar.gz.aesgcm",
          }
          if set(files)!=expected:
              raise SystemExit("Schema-30 public packet artifact surface mismatch")
          summary_sha=hashlib.sha256(files["ADJUDICATION_PACKET_SUMMARY.json"].read_bytes()).hexdigest()
          if summary_sha!=t["source_packet_redacted_summary_sha256"]:
              raise SystemExit("Schema-30 redacted summary SHA mismatch")
          enc=files["h392-adjudication-packet-source-bearing.tar.gz.aesgcm"]
          encsha=hashlib.sha256(enc.read_bytes()).hexdigest()
          if (
              encsha!=t["source_packet_encrypted_bundle_sha256"]
              or files["ENCRYPTED_ADJUDICATION_PACKET_SHA256.txt"].read_text().strip()!=encsha
          ):
              raise SystemExit("Schema-30 encrypted packet binding mismatch")
          arc=work/"schema30-source-bearing.tar.gz"
          decrypt_file(enc,arc,key)
          safe_untar(arc,packet_root)
          arc.unlink()
          inner={p.name:p for p in packet_root.iterdir() if p.is_file()}
          expected_inner={
              "ADJUDICATION_PACKET.jsonl",
              "ADJUDICATION_DECISION_TEMPLATE.jsonl",
              "ADJUDICATION_SOURCE_TARGET.json",
              "ADJUDICATION_PACKET_MANIFEST.json",
          }
          if set(inner)!=expected_inner:
              raise SystemExit("Schema-30 decrypted packet surface mismatch")
          manifest=json.loads(inner["ADJUDICATION_PACKET_MANIFEST.json"].read_text())
          if (
              manifest.get("protocol_freeze_schema")!=30
              or manifest.get("case_count")!=158
              or manifest.get("packet_sha256")!=t["source_packet_sha256"]
              or manifest.get("decision_template_sha256")!=t["legacy_schema30_decision_template_sha256"]
          ):
              raise SystemExit("Schema-30 packet manifest binding mismatch")
          if hashlib.sha256(inner["ADJUDICATION_PACKET.jsonl"].read_bytes()).hexdigest()!=t["source_packet_sha256"]:
              raise SystemExit("Schema-30 plaintext packet SHA mismatch")
          if hashlib.sha256(inner["ADJUDICATION_DECISION_TEMPLATE.jsonl"].read_bytes()).hexdigest()!=t["legacy_schema30_decision_template_sha256"]:
              raise SystemExit("legacy Schema-30 decision-template SHA mismatch")
          PY

      - name: Build Schema-31-compatible blank decision template
        run: |
          set -euo pipefail
          cd engines/hadith/qualification/H3.9.2
          python -m benchmark_campaign build-schema31-decision-template             --packet "$PACKET_ROOT/ADJUDICATION_PACKET.jsonl"             --out-dir "$TEMPLATE_ROOT"             --expected-packet-sha256 "44df7e629adb56a8a822a08de95f1025f439db40cd7a3501028be114b2c5eb27"             > "$REDACTED_ROOT/SCHEMA31_DECISION_TEMPLATE_SUMMARY.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["TEMPLATE_ROOT"])
          rows=[json.loads(x) for x in (root/"SCHEMA31_ADJUDICATION_DECISION_TEMPLATE.jsonl").read_text().splitlines() if x.strip()]
          if len(rows)!=158:
              raise SystemExit("Schema-31 decision-template count mismatch")
          for row in rows:
              if "decision" in row:
                  raise SystemExit("legacy unattested top-level decision leaked into Schema-31 template")
              if row.get("protocol_freeze_schema")!=31:
                  raise SystemExit("Schema-31 template row protocol mismatch")
              if row.get("reviews")!=[] or row.get("terminal_signoff") is not None:
                  raise SystemExit("Schema-31 blank template must not prepopulate human decisions")
              if row.get("reviewer_registry_snapshot_sha256") is not None:
                  raise SystemExit("Schema-31 blank template must not prepopulate reviewer registry binding")
          PY

      - name: Reconfirm main before encryption
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"

      - name: Encrypt Schema-31 decision template
        env:
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          tar -C "$TEMPLATE_ROOT" -czf "$WORK_ROOT/schema31-decision-template.tar.gz" .
          cd engines/hadith/qualification/H3.9.2
          python -m benchmark_campaign.artifact_crypto encrypt             --input "$WORK_ROOT/schema31-decision-template.tar.gz"             --output "$REDACTED_ROOT/h392-schema31-decision-template.tar.gz.aesgcm"             --passphrase-env ARTIFACT_KEY
          sha256sum "$REDACTED_ROOT/h392-schema31-decision-template.tar.gz.aesgcm" | awk '{print $1}' > "$REDACTED_ROOT/ENCRYPTED_SCHEMA31_DECISION_TEMPLATE_SHA256.txt"
          rm -f "$WORK_ROOT/schema31-decision-template.tar.gz"
          rm -rf "$PACKET_ROOT" "$TEMPLATE_ROOT" "$WORK_ROOT/schema30-artifact" "$WORK_ROOT/schema30-artifact.zip"

      - name: Validate redacted upload surface
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["REDACTED_ROOT"])
          expected={
              "SCHEMA31_DECISION_TEMPLATE_SUMMARY.json",
              "h392-schema31-decision-template.tar.gz.aesgcm",
              "ENCRYPTED_SCHEMA31_DECISION_TEMPLATE_SHA256.txt",
          }
          actual={p.name for p in root.iterdir() if p.is_file()}
          if actual!=expected:
              raise SystemExit(f"unexpected Schema-31 template upload surface: {sorted(actual)}")
          summary=json.loads((root/"SCHEMA31_DECISION_TEMPLATE_SUMMARY.json").read_text())
          if (
              summary.get("protocol_freeze_schema")!=31
              or summary.get("case_count")!=158
              or summary.get("blank_template") is not True
              or summary.get("contains_terminal_decisions") is not False
              or summary.get("legacy_top_level_decision_field_present") is not False
              or summary.get("canonical_terminal_decision_path")!="terminal_signoff.decision"
          ):
              raise SystemExit("Schema-31 decision-template summary contract mismatch")
          PY

      - name: Reconfirm main before upload
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"

      - name: Upload encrypted Schema-31 decision template
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h392-schema31-decision-template
          path: /tmp/h392-schema31-template/redacted
          if-no-files-found: error
          retention-days: 90
