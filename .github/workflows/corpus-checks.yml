name: Corpus integrity checks
on:
  push:
    paths:
      - 'corpus/**'
      - 'core/review_gate.py'
      - 'docs/RISK_BASED_ASSURANCE.md'
      - 'docs/REVIEW_POLICY.md'
      - '.github/workflows/corpus-checks.yml'
  pull_request:
    paths:
      - 'corpus/**'
      - '.github/workflows/corpus-checks.yml'
jobs:
  structural-tests:
    name: Corpus tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF evidence test dependency
        run: python -m pip install 'PyMuPDF>=1.26,<1.27'
      - name: Execute corpus tests
        run: python -m unittest discover -s corpus/tests -v
