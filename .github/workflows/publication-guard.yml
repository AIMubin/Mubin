name: Mubin publication and tracked-source guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-tip:
    name: Public tracked-artifact safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Synthetic path and historical redaction tests
        run: python -m unittest qa.tests.test_publication_guard -v
      - name: Inspect current checkout and only reachable historical versions
        run: python -m qa.publication_guard --history
      - name: Verify private witness-publication negative controls
        run: python -m qa.check_b02c6_witness_prep
