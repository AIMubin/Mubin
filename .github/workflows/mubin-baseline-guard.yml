name: Mubin baseline guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-safety:
    name: Baseline contracts and public-preview (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install -r core/requirements-test.txt
      - name: Compile shared kernel and release
        run: python -m compileall -q core/contracts core/orchestration release
      - name: Integration contracts and bounded DAG execution
        run: python -m unittest discover -s evaluation/integration -v
      - name: P0 inference safety regression
        run: python -m unittest core.tests.test_inference_foundation -v
      - name: Public preview regression tests
        run: python -m unittest discover -s release/tests -v
      - name: Revalidate published metadata
        run: python -m release.public_preview --check
