name: Mubin P1 offline provenance

on:
  pull_request:
    paths:
      - "core/provenance/**"
      - "core/tests/test_provenance.py"
      - "schemas/source-snapshot-manifest.schema.json"
      - "docs/P1-PROVENANCE.md"
      - "docs/reviews/P1-**"
      - ".github/workflows/mubin-p1-provenance.yml"
  push:
    branches: [main, "p1/**", "p1-*"]
    paths:
      - "core/provenance/**"
      - "core/tests/test_provenance.py"
      - "schemas/source-snapshot-manifest.schema.json"
      - "docs/P1-PROVENANCE.md"
      - "docs/reviews/P1-**"
      - ".github/workflows/mubin-p1-provenance.yml"

permissions:
  contents: read

jobs:
  offline_provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q core/provenance core/inference core/tests
      - run: python -m core.provenance --help
      - run: python -m unittest discover -s core/tests -v
