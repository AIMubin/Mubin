name: H3.9.2 reserve evidence consolidation

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: engines/hadith/qualification/H3.9.2
    env:
      EVIDENCE_ROOT: /tmp/h392-reserve-consolidation/evidence
      CONSOLIDATED_DIR: /tmp/h392-reserve-consolidation/source-bearing
      SOURCE_CACHE_DIR: /tmp/h392-reserve-consolidation/source-cache
      REDACTED_DIR: /tmp/h392-reserve-consolidation/redacted

    steps:
      - name: Checkout Mubin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refuse stale or non-main dispatch
        run: |
          set -eu
          if [ "${GITHUB_REF_NAME:-}" != "main" ]; then
            echo "Reserve consolidation must be dispatched from main." >&2
            exit 1
          fi
          current="$(git rev-parse HEAD)"
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$latest"
          if [ "$current" != "$latest" ]; then
            echo "Refusing stale reserve consolidation; dispatch from current main." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engines/hadith/qualification/H3.9.2/requirements.txt

      - name: Install campaign dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate repository-reviewed reserve consolidation target
        env:
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -eu
          test -n "$ARTIFACT_KEY"
          python - <<'PY'
          import json
          from pathlib import Path

          from benchmark_campaign.core import sha256_file
          from benchmark_campaign.post_consolidation import validate_reserve_activation

          root = Path.cwd()
          status = json.loads(
              (root / "artifacts" / "H3.9.2-STATUS.json").read_text(encoding="utf-8")
          )
          target = status.get("reserve_consolidation_target")
          if not isinstance(target, dict):
              raise SystemExit("reserve consolidation target missing")
          if target.get("ready") is not True or target.get("completed") is not False:
              raise SystemExit("reserve consolidation target is not open")
          if target.get("workflow") != ".github/workflows/h392-reserve-consolidation.yml":
              raise SystemExit("reserve consolidation workflow binding mismatch")
          if int(target.get("protocol_freeze_schema", 0)) != 26:
              raise SystemExit("reserve consolidation requires freeze schema 26")
          if int(status.get("freeze_schema_version", 0)) != 26:
              raise SystemExit("repository freeze schema mismatch")

          execution = status.get("reserve_execution_target")
          if not isinstance(execution, dict):
              raise SystemExit("reserve execution target missing")
          if execution.get("ready") is not False:
              raise SystemExit("reserve execution must be closed against redispatch")
          if execution.get("completed") is not False:
              raise SystemExit("reserve execution must remain unconsolidated")
          if execution.get("execution_succeeded") is not True:
              raise SystemExit("reserve execution has not reached successful evidence state")
          if execution.get("consolidation_pending") is not True:
              raise SystemExit("reserve execution is not awaiting consolidation")
          if int(execution.get("successful_run_id", 0)) != int(target["source_run_id"]):
              raise SystemExit("reserve execution/consolidation run binding mismatch")
          if int(execution.get("successful_run_final_attempt", 0)) != int(
              target["source_run_final_attempt"]
          ):
              raise SystemExit("reserve execution/consolidation attempt binding mismatch")
          if execution.get("runner_commit") != target.get("source_head_sha"):
              raise SystemExit("reserve execution/consolidation head SHA mismatch")

          activation_path = root / status["reserve_activation"]["evidence_path"]
          activation = validate_reserve_activation(root, activation_path, [])
          activation_sha = sha256_file(activation_path)
          if target.get("activation_manifest_sha256") != activation_sha:
              raise SystemExit("reserve consolidation activation binding mismatch")
          if activation.get("cumulative_ledger_sha256") != target.get(
              "cumulative_ledger_sha256"
          ):
              raise SystemExit("reserve consolidation cumulative-ledger binding mismatch")
          if activation.get("replacement_eligibility_sha256") != target.get(
              "replacement_eligibility_sha256"
          ):
              raise SystemExit("reserve consolidation eligibility binding mismatch")

          expected_count = int(target.get("expected_task_count", -1))
          expected_shards = int(target.get("expected_shards", -1))
          if expected_count != 41 or int(activation["activated_reserve_slot_count"]) != 41:
              raise SystemExit("reserve consolidation must remain bound to exactly 41 slots")
          artifacts = target.get("source_artifacts")
          if not isinstance(artifacts, list) or len(artifacts) != expected_shards:
              raise SystemExit("reserve consolidation shard target count mismatch")

          seen_artifacts = set()
          seen_jobs = set()
          cursor = 0
          for row in sorted(artifacts, key=lambda item: int(item["task_offset"])):
              artifact_id = int(row["artifact_id"])
              job_id = int(row["source_job_id"])
              if artifact_id in seen_artifacts or job_id in seen_jobs:
                  raise SystemExit("reserve consolidation target duplicates artifact/job identity")
              seen_artifacts.add(artifact_id)
              seen_jobs.add(job_id)
              offset = int(row["task_offset"])
              limit = int(row["task_limit"])
              if offset != cursor or limit < 1:
                  raise SystemExit("reserve consolidation target has gap/overlap")
              cursor += limit
              if row.get("artifact_name") != f"h392-curation-chunk-{offset}-{limit}":
                  raise SystemExit("reserve consolidation target artifact name mismatch")
              if int(row.get("run_attempt", 0)) not in {1, 2}:
                  raise SystemExit("reserve consolidation target run attempt invalid")
              for key in (
                  "artifact_digest",
                  "summary_sha256",
                  "encrypted_bundle_sha256",
                  "artifact_created_at",
              ):
                  if not isinstance(row.get(key), str) or not row[key]:
                      raise SystemExit(f"reserve consolidation target missing {key}")
          if cursor != expected_count:
              raise SystemExit("reserve consolidation target does not cover all activated slots")

          outcomes = target.get("expected_outcomes")
          if not isinstance(outcomes, dict):
              raise SystemExit("reserve consolidation expected outcomes missing")
          if sum(int(outcomes.get(k, -1)) for k in ("promoted", "adjudication", "skipped")) != 41:
              raise SystemExit("reserve consolidation expected outcome accounting mismatch")
          PY

      - name: Acquire and verify pinned non-holdout sources for reserve evidence grounding
        run: |
          set -eu
          python -m benchmark_campaign acquire-sources             --partition non_holdout             --cache-dir "$SOURCE_CACHE_DIR"             > "$RUNNER_TEMP/h392-reserve-consolidation-acquire.json"
          python -m benchmark_campaign verify-source-cache             --partition non_holdout             --cache-dir "$SOURCE_CACHE_DIR"             > "$RUNNER_TEMP/h392-reserve-consolidation-verify.json"

      - name: Fetch exact reserve aggregate and shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$EVIDENCE_ROOT"
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          campaign_root = Path.cwd()
          status = json.loads(
              (campaign_root / "artifacts" / "H3.9.2-STATUS.json").read_text(encoding="utf-8")
          )
          target = status["reserve_consolidation_target"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          evidence_root = Path(os.environ["EVIDENCE_ROOT"])
          run_id = int(target["source_run_id"])

          def request(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "mubin-h392-reserve-consolidation",
                  },
              )
              return urllib.request.urlopen(req, timeout=120)

          def api_json(url):
              with request(url) as response:
                  return json.load(response)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def artifact_download_location(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "mubin-h392-reserve-consolidation",
                  },
              )
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(req, timeout=120):
                      raise SystemExit("artifact download endpoint unexpectedly returned a body")
              except urllib.error.HTTPError as exc:
                  if exc.code not in {301, 302, 303, 307, 308}:
                      raise
                  location = exc.headers.get("Location")
              if not location:
                  raise SystemExit("artifact download endpoint returned no redirect location")
              parsed = urllib.parse.urlparse(location)
              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.username
                  or parsed.password
              ):
                  raise SystemExit("artifact download redirect is not a safe HTTPS URL")
              return location

          def download_artifact(artifact, archive):
              location = artifact_download_location(str(artifact["archive_download_url"]))
              req = urllib.request.Request(
                  location,
                  headers={"User-Agent": "mubin-h392-reserve-consolidation"},
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  archive.write_bytes(response.read())

          def safe_unzip(archive, dest):
              dest.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as zf:
                  for info in zf.infolist():
                      p = Path(info.filename)
                      mode = (info.external_attr >> 16) & 0xFFFF
                      if p.is_absolute() or ".." in p.parts or stat.S_ISLNK(mode):
                          raise SystemExit(f"unsafe artifact ZIP member: {info.filename}")
                  zf.extractall(dest)

          def digest_hex(value):
              if not isinstance(value, str) or not value.startswith("sha256:"):
                  raise SystemExit("repository target artifact digest is invalid")
              return value.split(":", 1)[1]

          def parse_time(value):
              if not isinstance(value, str):
                  raise SystemExit("missing GitHub timestamp")
              return datetime.fromisoformat(value.replace("Z", "+00:00")).astimezone(timezone.utc)

          run = api_json(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("reviewed reserve execution run is not successful")
          if int(run.get("run_attempt", 0)) != int(target["source_run_final_attempt"]):
              raise SystemExit("reserve execution final attempt differs from repository target")
          if run.get("head_branch") != "main" or run.get("head_sha") != target["source_head_sha"]:
              raise SystemExit("reserve execution branch/head differs from repository target")
          if run.get("path") != ".github/workflows/h392-reserve-campaign.yml":
              raise SystemExit("source run is not the reviewed reserve campaign workflow")
          if run.get("event") != "workflow_dispatch":
              raise SystemExit("reserve execution was not manually dispatched")

          aggregate_id = int(target["aggregate_artifact_id"])
          aggregate = api_json(
              f"https://api.github.com/repos/{repo}/actions/artifacts/{aggregate_id}"
          )
          if (
              aggregate.get("expired") is True
              or aggregate.get("name") != target["aggregate_artifact_name"]
              or int(aggregate.get("workflow_run", {}).get("id", 0)) != run_id
              or aggregate.get("workflow_run", {}).get("head_sha") != target["source_head_sha"]
              or aggregate.get("digest") != target["aggregate_artifact_digest"]
          ):
              raise SystemExit("reserve aggregate artifact metadata differs from repository target")

          aggregate_archive = Path(os.environ["RUNNER_TEMP"]) / "reserve-aggregate.zip"
          aggregate_dir = Path(os.environ["RUNNER_TEMP"]) / "reserve-aggregate"
          download_artifact(aggregate, aggregate_archive)
          if hashlib.sha256(aggregate_archive.read_bytes()).hexdigest() != digest_hex(
              target["aggregate_artifact_digest"]
          ):
              raise SystemExit("reserve aggregate ZIP digest mismatch")
          safe_unzip(aggregate_archive, aggregate_dir)
          aggregate_files = [p for p in aggregate_dir.rglob("*") if p.is_file()]
          if len(aggregate_files) != 1 or aggregate_files[0].name != "RESERVE_CAMPAIGN_SUMMARY.json":
              raise SystemExit("reserve aggregate artifact layout is unexpected")
          aggregate_summary_path = aggregate_files[0]
          if hashlib.sha256(aggregate_summary_path.read_bytes()).hexdigest() != target[
              "aggregate_summary_sha256"
          ]:
              raise SystemExit("reserve aggregate summary SHA-256 mismatch")
          aggregate_summary = json.loads(aggregate_summary_path.read_text(encoding="utf-8"))
          if (
              aggregate_summary.get("campaign_id") != "H3.9.2"
              or aggregate_summary.get("kind") != "approved_non_holdout_reserve_campaign_summary"
              or aggregate_summary.get("github_sha") != target["source_head_sha"]
              or aggregate_summary.get("activation_manifest_sha256")
                  != target["activation_manifest_sha256"]
              or aggregate_summary.get("coverage_complete") is not True
              or aggregate_summary.get("coverage_errors") != []
              or aggregate_summary.get("shard_job_result") != "success"
              or int(aggregate_summary.get("completed_shards", -1)) != int(target["expected_shards"])
              or int(aggregate_summary.get("expected_task_count", -1))
                  != int(target["expected_task_count"])
          ):
              raise SystemExit("reserve aggregate summary contract mismatch")
          totals = aggregate_summary.get("totals", {})
          for key, expected in target["expected_outcomes"].items():
              if int(totals.get(key, -1)) != int(expected):
                  raise SystemExit(f"reserve aggregate {key} count differs from repository target")
          shutil.rmtree(aggregate_dir)
          aggregate_archive.unlink()

          cursor = 0
          for reviewed in sorted(
              target["source_artifacts"], key=lambda row: int(row["task_offset"])
          ):
              offset = int(reviewed["task_offset"])
              limit = int(reviewed["task_limit"])
              if offset != cursor:
                  raise SystemExit("reviewed reserve artifacts have gap/overlap")
              cursor += limit

              artifact_id = int(reviewed["artifact_id"])
              artifact = api_json(
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}"
              )
              if (
                  artifact.get("expired") is True
                  or artifact.get("name") != reviewed["artifact_name"]
                  or artifact.get("digest") != reviewed["artifact_digest"]
                  or artifact.get("created_at") != reviewed["artifact_created_at"]
                  or int(artifact.get("workflow_run", {}).get("id", 0)) != run_id
                  or artifact.get("workflow_run", {}).get("head_sha")
                      != target["source_head_sha"]
              ):
                  raise SystemExit(f"reserve artifact metadata mismatch: {artifact_id}")

              job_id = int(reviewed["source_job_id"])
              job = api_json(f"https://api.github.com/repos/{repo}/actions/jobs/{job_id}")
              expected_job_name = f"shard ({offset}, {limit}) / curate-verify"
              if (
                  int(job.get("run_id", 0)) != run_id
                  or int(job.get("run_attempt", 0)) != int(reviewed["run_attempt"])
                  or job.get("name") != expected_job_name
                  or job.get("conclusion") != "success"
                  or job.get("head_sha") != target["source_head_sha"]
              ):
                  raise SystemExit(f"reserve artifact job provenance mismatch: {artifact_id}")
              created = parse_time(artifact["created_at"])
              started = parse_time(job["started_at"])
              completed = parse_time(job["completed_at"])
              if not (started <= created <= completed):
                  raise SystemExit(f"reserve artifact timestamp escapes bound shard job: {artifact_id}")

              evidence = evidence_root / f"run-{run_id}-artifact-{artifact_id}"
              raw_dir = evidence / "_raw"
              evidence.mkdir(parents=True)
              archive = evidence / "artifact.zip"
              download_artifact(artifact, archive)
              actual_zip_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
              if actual_zip_sha != digest_hex(reviewed["artifact_digest"]):
                  raise SystemExit(f"reserve artifact ZIP digest mismatch: {artifact_id}")
              safe_unzip(archive, raw_dir)

              summaries = list(raw_dir.rglob("CURATION_RUN_SUMMARY.json"))
              bundles = list(raw_dir.rglob("h392-curation-source-bearing.tar.gz.aesgcm"))
              bundle_hashes = list(raw_dir.rglob("ENCRYPTED_BUNDLE_SHA256.txt"))
              if len(summaries) != 1 or len(bundles) != 1 or len(bundle_hashes) != 1:
                  raise SystemExit(f"reserve artifact layout is unexpected: {artifact_id}")

              summary_sha = hashlib.sha256(summaries[0].read_bytes()).hexdigest()
              encrypted_sha = hashlib.sha256(bundles[0].read_bytes()).hexdigest()
              declared_sha = bundle_hashes[0].read_text(encoding="utf-8").strip()
              if summary_sha != reviewed["summary_sha256"]:
                  raise SystemExit(f"reserve shard summary SHA-256 mismatch: {artifact_id}")
              if encrypted_sha != reviewed["encrypted_bundle_sha256"]:
                  raise SystemExit(f"reserve encrypted bundle SHA-256 mismatch: {artifact_id}")
              if declared_sha != encrypted_sha:
                  raise SystemExit(f"reserve encrypted bundle declaration mismatch: {artifact_id}")

              summary = json.loads(summaries[0].read_text(encoding="utf-8"))
              if (
                  summary.get("campaign_id") != "H3.9.2"
                  or summary.get("kind") != "non_holdout_curator_verifier_chunk"
                  or summary.get("task_scope") != "approved_reserve"
                  or summary.get("github_sha") != target["source_head_sha"]
                  or str(summary.get("github_run_id")) != str(run_id)
                  or summary.get("reserve_activation_sha256")
                      != target["activation_manifest_sha256"]
                  or int(summary.get("task_offset", -1)) != offset
                  or int(summary.get("task_limit", -1)) != limit
                  or int(summary.get("selected_task_count", -1)) != limit
                  or summary.get("contains_source_text") is not False
                  or summary.get("contains_gold_payloads") is not False
                  or summary.get("source_bearing_bundle_encrypted") is not True
              ):
                  raise SystemExit(f"reserve shard summary contract mismatch: {artifact_id}")

              shutil.copy2(summaries[0], evidence / "CURATION_RUN_SUMMARY.json")
              shutil.copy2(
                  bundles[0],
                  evidence / "h392-curation-source-bearing.tar.gz.aesgcm",
              )
              (evidence / "ORIGIN.json").write_text(
                  json.dumps({
                      "github_run_id": run_id,
                      "github_run_attempt": int(reviewed["run_attempt"]),
                      "source_job_id": job_id,
                      "conclusion": "success",
                      "head_branch": "main",
                      "head_sha": target["source_head_sha"],
                      "workflow_path": ".github/workflows/h392-reserve-campaign.yml",
                      "artifact_id": artifact_id,
                      "artifact_name": reviewed["artifact_name"],
                      "artifact_sha256": actual_zip_sha,
                      "summary_sha256": summary_sha,
                      "encrypted_bundle_sha256": encrypted_sha,
                      "artifact_created_at": artifact["created_at"],
                      "source_job_started_at": job["started_at"],
                      "source_job_completed_at": job["completed_at"],
                  }, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              shutil.rmtree(raw_dir)
              archive.unlink()

          if cursor != int(target["expected_task_count"]):
              raise SystemExit("reserve source artifact coverage is incomplete")
          print(f"provenance-bound reserve artifacts: {len(target['source_artifacts'])}")
          PY

      - name: Decrypt reserve source-bearing evidence into ephemeral workspace
        env:
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -eu
          python - <<'PY'
          import os
          from pathlib import Path
          import tarfile

          from benchmark_campaign.artifact_crypto import decrypt_file

          root = Path(os.environ["EVIDENCE_ROOT"])
          passphrase = os.environ["ARTIFACT_KEY"]
          for evidence in sorted(path for path in root.iterdir() if path.is_dir()):
              encrypted = evidence / "h392-curation-source-bearing.tar.gz.aesgcm"
              archive = evidence / "source-bearing.tar.gz"
              target = evidence / "source-bearing"
              decrypt_file(encrypted, archive, passphrase)
              target.mkdir()
              with tarfile.open(archive, "r:gz") as tf:
                  members = tf.getmembers()
                  for member in members:
                      p = Path(member.name)
                      if (
                          p.is_absolute()
                          or ".." in p.parts
                          or member.issym()
                          or member.islnk()
                          or member.isdev()
                      ):
                          raise SystemExit(f"unsafe reserve source-bearing member: {member.name}")
                  tf.extractall(target, members=members, filter="data")
              archive.unlink()
              encrypted.unlink()
          PY

      - name: Reconfirm main before reserve consolidation
        run: |
          set -eu
          current="$(git rev-parse HEAD)"
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$latest"
          if [ "$current" != "$latest" ]; then
            echo "Main advanced while reserve evidence was being acquired; dispatch again." >&2
            exit 1
          fi

      - name: Consolidate approved reserve evidence
        run: |
          set -eu
          mkdir -p "$CONSOLIDATED_DIR" "$REDACTED_DIR"
          activation_path="$(python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("artifacts/H3.9.2-STATUS.json").read_text(encoding="utf-8"))
          print(status["reserve_activation"]["evidence_path"])
          PY
          )"
          python -m benchmark_campaign consolidate-reserve             --evidence-root "$EVIDENCE_ROOT"             --out-dir "$CONSOLIDATED_DIR"             --source-cache-dir "$SOURCE_CACHE_DIR"             --activation "$activation_path"             > "$REDACTED_DIR/RESERVE_CONSOLIDATION_SUMMARY.json"
          {
            echo '### H3.9.2 reserve evidence consolidation'
            echo '~~~json'
            cat "$REDACTED_DIR/RESERVE_CONSOLIDATION_SUMMARY.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt consolidated reserve source-bearing evidence
        env:
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -eu
          tar -C "$CONSOLIDATED_DIR" -czf /tmp/h392-reserve-consolidated-source-bearing.tar.gz .
          python -m benchmark_campaign.artifact_crypto encrypt             --input /tmp/h392-reserve-consolidated-source-bearing.tar.gz             --output "$REDACTED_DIR/h392-reserve-consolidated-source-bearing.tar.gz.aesgcm"             --passphrase-env ARTIFACT_KEY
          sha256sum "$REDACTED_DIR/h392-reserve-consolidated-source-bearing.tar.gz.aesgcm"             | awk '{print $1}' > "$REDACTED_DIR/ENCRYPTED_RESERVE_CONSOLIDATED_BUNDLE_SHA256.txt"
          rm -f /tmp/h392-reserve-consolidated-source-bearing.tar.gz

      - name: Remove decrypted reserve evidence and prove upload is redacted
        run: |
          set -eu
          rm -rf "$EVIDENCE_ROOT" "$CONSOLIDATED_DIR" "$SOURCE_CACHE_DIR"
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["REDACTED_DIR"])
          expected = {
              "RESERVE_CONSOLIDATION_SUMMARY.json",
              "h392-reserve-consolidated-source-bearing.tar.gz.aesgcm",
              "ENCRYPTED_RESERVE_CONSOLIDATED_BUNDLE_SHA256.txt",
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected reserve consolidation upload surface: {sorted(actual)}")
          for name in expected:
              if not (root / name).is_file() or (root / name).stat().st_size < 1:
                  raise SystemExit(f"reserve consolidation upload file missing/empty: {name}")
          PY

      - name: Reconfirm main before publishing reserve consolidation
        run: |
          set -eu
          current="$(git rev-parse HEAD)"
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$latest"
          if [ "$current" != "$latest" ]; then
            echo "Main advanced before reserve consolidation publication; refusing stale artifact." >&2
            exit 1
          fi

      - name: Upload encrypted reserve consolidation and redacted summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h392-reserve-consolidated-evidence
          path: /tmp/h392-reserve-consolidation/redacted
          if-no-files-found: error
          retention-days: 30
