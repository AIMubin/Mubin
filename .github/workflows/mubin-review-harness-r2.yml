name: Mubin review harness R2 live PR evidence
on:
  pull_request:
    paths:
      - "core/review_harness/**"
      - "core/tests/test_review_harness_r2.py"
      - "docs/research/REVIEW-HARNESS-R2.md"
      - "docs/reviews/REVIEW-HARNESS-R2-AUDIT.md"
      - ".github/workflows/mubin-review-harness-r2.yml"
  push:
    branches: [main]
    paths:
      - "core/review_harness/**"
      - "core/tests/test_review_harness_r2.py"
      - "docs/research/REVIEW-HARNESS-R2.md"
      - "docs/reviews/REVIEW-HARNESS-R2-AUDIT.md"
      - ".github/workflows/mubin-review-harness-r2.yml"
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q core/review_harness core/tests/test_review_harness_r2.py
      - run: python -m unittest discover -s core/tests -p 'test_review_harness_r2.py' -v
      - run: python -m unittest discover -s core/tests -v
      # Do not treat an in-progress P0 run as a failure; always report bounded
      # live advisory data, and never mutate PRs/labels/branches.
      - name: Observe live GitHub HEAD, paths and workflow outcomes
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MUBIN_PR_NUMBER: ${{ github.event.pull_request.number }}
          MUBIN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m core.review_harness.github_cli --pr "$MUBIN_PR_NUMBER" --expected-head "$MUBIN_PR_HEAD_SHA" --require-p0 --json
