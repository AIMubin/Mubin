name: Mubin E2E-01.1 scientific research slice (synthetic)
on:
  pull_request:
    paths:
      - "engines/e2e/**"
      - "core/tests/test_e2e_research_slice.py"
      - "core/tests/test_semantic_linkage.py"
      - "core/tests/test_e2e_workspace_e013.py"
      - "core/tests/test_e2e_evaluation.py"
      - "core/tests/test_e2e_scientific_benchmark.py"
      - "evaluation/benchmarks/e2e_amr_cases_v01.json"
      - "engines/quran/research/operator_view.py"
      - "engines/quran/research/unified.py"
      - "engines/quran/research/qualification.py"
      - "engines/usul/pilots/amr_default.py"
      - ".github/workflows/mubin-e2e-research.yml"
      - "docs/research/E2E-01-RESEARCH-SLICE.md"
      - "docs/research/E2E-012-SEMANTIC-LINKAGE.md"
      - "docs/research/E2E-013-OPERATOR-WORKSPACE.md"
      - "docs/research/E2E-014-METADATA-EVALUATION.md"
      - "docs/research/E2E-014B1-AMR-CASEBOOK.md"
      - "engines/quran/research/workspace.py"
  push:
    branches: [main]
    paths:
      - "engines/e2e/**"
      - "core/tests/test_e2e_research_slice.py"
      - "core/tests/test_semantic_linkage.py"
      - "core/tests/test_e2e_workspace_e013.py"
      - "core/tests/test_e2e_evaluation.py"
      - "core/tests/test_e2e_scientific_benchmark.py"
      - "evaluation/benchmarks/e2e_amr_cases_v01.json"
      - ".github/workflows/mubin-e2e-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-linked-synthetic-integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install P0 validation dependencies
        run: python -m pip install -r core/requirements-test.txt
      - name: E2E synthetic SQLite + signed qualification + Usul pilot
        run: python -m unittest core.tests.test_e2e_research_slice core.tests.test_semantic_linkage core.tests.test_e2e_workspace_e013 core.tests.test_e2e_evaluation core.tests.test_e2e_scientific_benchmark -v
      - name: Compile entrypoints
        run: python -m compileall -q engines/e2e engines/quran/research/workspace.py
