name: Mubin Tafsir Center private sidecar synthetic verification

on:
  pull_request:
    paths:
      - "qa/tafsircenter_sidecar_v01.py"
      - "core/tests/test_tafsircenter_sidecar_v01.py"
      - ".github/workflows/mubin-tafsircenter-sidecar.yml"
      - "docs/research/TAFSIRCENTER-PRIVATE-SIDECAR-V01.md"
  push:
    branches: [main]
    paths:
      - "qa/tafsircenter_sidecar_v01.py"
      - "core/tests/test_tafsircenter_sidecar_v01.py"
      - ".github/workflows/mubin-tafsircenter-sidecar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-sidecar-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Offline synthetic-only schema, digest and privacy tests
        run: python -m unittest core.tests.test_tafsircenter_sidecar_v01 -v
      - name: Compile local verifier
        run: python -m compileall -q qa/tafsircenter_sidecar_v01.py

# No downloads, external database, cache, or artifact upload in CI.
# Operators run the real 214 MB verification separately on local private storage.
