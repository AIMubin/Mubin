name: Mubin R0.1b private read-only research adapters

on:
  pull_request:
    paths:
      - "engines/quran/research/**"
      - "core/tests/test_quran_research_adapters_r01b.py"
      - "docs/research/QURAN-R01B-PRIVATE-READONLY-ADAPTERS.md"
      - "docs/reviews/QURAN-R01B-PRIVATE-ADAPTERS-AUDIT.md"
      - ".github/workflows/mubin-quran-r01b-research-adapters.yml"
  push:
    branches: [main]
    paths:
      - "engines/quran/research/**"
      - "core/tests/test_quran_research_adapters_r01b.py"
      - ".github/workflows/mubin-quran-r01b-research-adapters.yml"

permissions:
  contents: read

jobs:
  private-adapters-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile isolated private adapters
        run: python -m compileall -q engines/quran/research
      - name: Mandatory offline 12-test adapter and permit security suite
        run: python -m unittest core.tests.test_quran_research_adapters_r01b -v
      - name: R0.1a evidence chain and private ingestion regression
        run: python -m unittest core.tests.test_private_evidence_v01 core.tests.test_corpus_ingest_v01 core.tests.test_tafsircenter_sidecar_v01 -v
# No source downloads; no signing keys, corpus texts or SQLite artifacts in CI.
