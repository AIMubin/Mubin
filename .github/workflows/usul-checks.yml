name: Usul U0.1 deterministic prototype checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engines/usul/**'
      - 'core/tests/test_usul_ut011.py'
      - 'evaluation/evidence/ut011_bab_amr_bridge_report.json'
      - 'corpus/reviews/u02-waraqat-private-source-acceptance-PASS.json'
      - '.gitattributes'
      - '.github/workflows/usul-checks.yml'
  pull_request:
    paths:
      - 'engines/usul/**'
      - 'core/tests/test_usul_ut011.py'
      - 'evaluation/evidence/ut011_bab_amr_bridge_report.json'
      - 'corpus/reviews/u02-waraqat-private-source-acceptance-PASS.json'
      - '.gitattributes'
      - '.github/workflows/usul-checks.yml'
jobs:
  usul-prototype:
    name: Usul U0.1 tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install P0 contract validator dependency
        run: python -m pip install 'jsonschema==4.25.1'
      - name: Execute synthetic deterministic semantics tests
        run: python -m unittest discover -s engines/usul/tests -v
      - name: UT-01.1 source-catalog contract and frozen receipt integrity
        run: python -m unittest core.tests.test_usul_ut011 -v
