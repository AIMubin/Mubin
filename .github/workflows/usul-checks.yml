name: Usul U0.1 deterministic prototype checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engines/usul/**'
      - '.gitattributes'
      - '.github/workflows/usul-checks.yml'
  pull_request:
    paths:
      - 'engines/usul/**'
      - '.gitattributes'
      - '.github/workflows/usul-checks.yml'
jobs:
  usul-prototype:
    name: Usul U0.1 tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install P0 contract validator dependency
        run: python -m pip install 'jsonschema==4.25.1'
      - name: Execute synthetic deterministic semantics tests
        run: python -m unittest discover -s engines/usul/tests -v
