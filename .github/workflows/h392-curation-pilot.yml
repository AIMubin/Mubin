name: H3.9.2 readiness + curation pilot

on:
  workflow_dispatch:
    inputs:
      task_offset:
        description: Zero-based offset inside the frozen non-holdout primary task plan
        required: true
        default: "0"
      task_limit:
        description: Number of tasks in this encrypted run chunk (1-64)
        required: true
        default: "8"
      curator_auth_style:
        description: Curator authentication header style
        type: choice
        options:
          - bearer
          - api-key
        default: bearer
      verifier_auth_style:
        description: Verifier authentication header style
        type: choice
        options:
          - bearer
          - api-key
        default: bearer
      curator_json_mode:
        description: Request JSON response mode only if the Curator endpoint supports it
        type: choice
        options:
          - "off"
          - json_object
        default: "off"
      verifier_json_mode:
        description: Request JSON response mode only if the Verifier endpoint supports it
        type: choice
        options:
          - "off"
          - json_object
        default: "off"
  workflow_call:
    inputs:
      task_offset:
        required: true
        type: string
      task_limit:
        required: true
        type: string
      curator_auth_style:
        required: true
        type: string
      verifier_auth_style:
        required: true
        type: string
      curator_json_mode:
        required: true
        type: string
      verifier_json_mode:
        required: true
        type: string
      skip_readiness:
        required: false
        type: boolean
        default: false
      readiness_sha:
        required: false
        type: string
        default: ""
      task_scope:
        required: false
        type: string
        default: "primary"
    secrets:
      H392_CURATOR_ENDPOINT:
        required: true
      H392_VERIFIER_ENDPOINT:
        required: true
      H392_CURATOR_MODEL_FAMILY:
        required: true
      H392_CURATOR_MODEL_REF:
        required: true
      H392_VERIFIER_MODEL_FAMILY:
        required: true
      H392_VERIFIER_MODEL_REF:
        required: true
      H392_CURATOR_API_KEY:
        required: true
      H392_VERIFIER_API_KEY:
        required: true
      H392_CURATION_ARTIFACT_KEY:
        required: true

permissions:
  contents: read

jobs:
  curate-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: engines/hadith/qualification/H3.9.2
    env:
      CACHE_DIR: /tmp/h392-curation/source-cache
      INDEX_DIR: /tmp/h392-curation/index
      RUN_DIR: /tmp/h392-curation/run
      REDACTED_DIR: /tmp/h392-curation/redacted
      TASK_OFFSET: ${{ inputs.task_offset }}
      TASK_LIMIT: ${{ inputs.task_limit }}
      TASK_SCOPE: ${{ inputs.task_scope || 'primary' }}
      CURATOR_AUTH_STYLE: ${{ inputs.curator_auth_style }}
      VERIFIER_AUTH_STYLE: ${{ inputs.verifier_auth_style }}
      CURATOR_JSON_MODE: ${{ inputs.curator_json_mode }}
      VERIFIER_JSON_MODE: ${{ inputs.verifier_json_mode }}

    steps:
      - name: Checkout Mubin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refuse stale or non-main dispatch
        run: |
          set -eu
          if [ "${GITHUB_REF_NAME:-}" != "main" ]; then
            echo "This readiness/pilot workflow must be dispatched from main." >&2
            exit 1
          fi
          current="$(git rev-parse HEAD)"
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$latest"
          if [ "$current" != "$latest" ]; then
            echo "Refusing stale workflow execution; dispatch a fresh run from current main." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engines/hadith/qualification/H3.9.2/requirements.txt

      - name: Install campaign dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fail closed if runtime credentials or endpoints are absent
        env:
          CURATOR_ENDPOINT: ${{ secrets.H392_CURATOR_ENDPOINT }}
          VERIFIER_ENDPOINT: ${{ secrets.H392_VERIFIER_ENDPOINT }}
          CURATOR_MODEL_FAMILY: ${{ secrets.H392_CURATOR_MODEL_FAMILY }}
          CURATOR_MODEL_REF: ${{ secrets.H392_CURATOR_MODEL_REF }}
          VERIFIER_MODEL_FAMILY: ${{ secrets.H392_VERIFIER_MODEL_FAMILY }}
          VERIFIER_MODEL_REF: ${{ secrets.H392_VERIFIER_MODEL_REF }}
          CURATOR_API_KEY: ${{ secrets.H392_CURATOR_API_KEY }}
          VERIFIER_API_KEY: ${{ secrets.H392_VERIFIER_API_KEY }}
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -eu
          test -n "$CURATOR_ENDPOINT"
          test -n "$VERIFIER_ENDPOINT"
          test -n "$CURATOR_MODEL_FAMILY"
          test -n "$VERIFIER_MODEL_FAMILY"
          test -n "$CURATOR_MODEL_REF"
          test -n "$VERIFIER_MODEL_REF"
          test -n "$CURATOR_API_KEY"
          test -n "$VERIFIER_API_KEY"
          test -n "$ARTIFACT_KEY"
          case "$CURATOR_ENDPOINT" in https://*) ;; *) echo "Curator base URL must be HTTPS" >&2; exit 1;; esac
          case "$VERIFIER_ENDPOINT" in https://*) ;; *) echo "Verifier base URL must be HTTPS" >&2; exit 1;; esac
          python - <<'PY'
          import os
          normalize = lambda s: " ".join(s.strip().casefold().split())
          if normalize(os.environ["CURATOR_MODEL_FAMILY"]) == normalize(os.environ["VERIFIER_MODEL_FAMILY"]):
              raise SystemExit("Curator and Verifier model families must differ")
          PY

      - name: Validate chunk bounds
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from benchmark_campaign.factory import build_factory_plan
          from benchmark_campaign.post_consolidation import validate_reserve_activation

          root = Path(".").resolve()
          plan = build_factory_plan(root)
          scope = os.environ["TASK_SCOPE"]
          offset = int(os.environ["TASK_OFFSET"])
          limit = int(os.environ["TASK_LIMIT"])

          if scope == "primary":
              available = int(plan["primary_non_holdout_slots"])
              bound_name = "frozen non-holdout primary plan"
          elif scope == "approved_reserve":
              status = json.loads(
                  (root / "artifacts" / "H3.9.2-STATUS.json").read_text(encoding="utf-8")
              )
              if status.get("reserve_reconciliation_enabled") is not True:
                  raise SystemExit("repository-approved reserve reconciliation is not enabled")
              approved = status.get("reserve_activation")
              if not isinstance(approved, dict) or approved.get("enabled") is not True:
                  raise SystemExit("repository-approved reserve activation is missing")
              activation_path = root / approved["evidence_path"]
              activation = validate_reserve_activation(root, activation_path, [])
              available = int(activation["activated_reserve_slot_count"])
              if available != int(approved["activated_reserve_slot_count"]):
                  raise SystemExit("approved reserve count differs from activation evidence")
              bound_name = "repository-approved reserve activation"
          else:
              raise SystemExit("TASK_SCOPE must be primary or approved_reserve")

          if offset < 0 or offset >= available:
              raise SystemExit(f"TASK_OFFSET must be in [0, {available - 1}]")
          if limit < 1 or limit > 64:
              raise SystemExit("TASK_LIMIT must be in [1, 64]")
          if offset + limit > available:
              raise SystemExit(f"TASK_OFFSET + TASK_LIMIT exceeds the {bound_name}")
          PY

      - name: Build isolated ephemeral workspace
        run: mkdir -p "$CACHE_DIR" "$INDEX_DIR" "$RUN_DIR" "$REDACTED_DIR"

      - name: Run offline readiness suite
        if: ${{ inputs.skip_readiness != true }}
        run: |
          python -m benchmark_campaign.readiness \
            --offline-only \
            --out "$REDACTED_DIR/OFFLINE_READINESS.json"

      - name: Run live Curator and Verifier readiness canaries
        if: ${{ inputs.skip_readiness != true }}
        env:
          MUBIN_READINESS_CURATOR_ENDPOINT: ${{ secrets.H392_CURATOR_ENDPOINT }}
          MUBIN_READINESS_CURATOR_MODEL_REF: ${{ secrets.H392_CURATOR_MODEL_REF }}
          MUBIN_READINESS_CURATOR_API_KEY: ${{ secrets.H392_CURATOR_API_KEY }}
          MUBIN_READINESS_VERIFIER_ENDPOINT: ${{ secrets.H392_VERIFIER_ENDPOINT }}
          MUBIN_READINESS_VERIFIER_MODEL_REF: ${{ secrets.H392_VERIFIER_MODEL_REF }}
          MUBIN_READINESS_VERIFIER_API_KEY: ${{ secrets.H392_VERIFIER_API_KEY }}
        run: |
          set +e
          python -m benchmark_campaign.readiness \
            --offline-report "$REDACTED_DIR/OFFLINE_READINESS.json" \
            --out "$REDACTED_DIR/READINESS_GATE.json" \
            --curator-auth-style "$CURATOR_AUTH_STYLE" \
            --verifier-auth-style "$VERIFIER_AUTH_STYLE" \
            --curator-json-mode "$CURATOR_JSON_MODE" \
            --verifier-json-mode "$VERIFIER_JSON_MODE" \
            --live-timeout 600
          readiness_rc=$?
          set -e
          {
            echo '### H3.9.2 comprehensive readiness gate'
            echo '```json'
            cat "$REDACTED_DIR/READINESS_GATE.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$readiness_rc"

      - name: Validate delegated campaign readiness
        if: ${{ inputs.skip_readiness == true }}
        env:
          READINESS_SHA: ${{ inputs.readiness_sha }}
        run: |
          set -eu
          test -n "$READINESS_SHA"
          if [ "$READINESS_SHA" != "$GITHUB_SHA" ]; then
            echo "Delegated readiness SHA does not match this shard SHA." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          out = Path(os.environ["REDACTED_DIR"]) / "READINESS_GATE.json"
          report = {
              "schema_version": 1,
              "campaign_id": "H3.9.2",
              "kind": "delegated_comprehensive_readiness_gate",
              "github_sha": os.environ.get("GITHUB_SHA"),
              "ready": True,
              "delegated": True,
          }
          out.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Reconfirm main before real curation
        run: |
          set -eu
          current="$(git rev-parse HEAD)"
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$latest"
          if [ "$current" != "$latest" ]; then
            echo "Main advanced before real curation; dispatch a fresh run." >&2
            exit 1
          fi

      - name: Acquire and re-verify pinned non-holdout sources
        run: |
          python -m benchmark_campaign acquire-sources \
            --partition non_holdout \
            --cache-dir "$CACHE_DIR" \
            > "$REDACTED_DIR/acquire-report.json"
          python -m benchmark_campaign verify-source-cache \
            --partition non_holdout \
            --cache-dir "$CACHE_DIR" \
            > "$REDACTED_DIR/verify-report.json"

      - name: Build source index and frozen candidate task set
        run: |
          python -m benchmark_campaign factory-index-sources \
            --partition non_holdout \
            --cache-dir "$CACHE_DIR" \
            --out-dir "$INDEX_DIR" \
            > "$REDACTED_DIR/index-report.json"
          python -m benchmark_campaign factory-plan \
            --out "$RUN_DIR/factory-plan.json" \
            > /dev/null
          python -m benchmark_campaign factory-build-tasks \
            --partition non_holdout \
            --plan "$RUN_DIR/factory-plan.json" \
            --index-dir "$INDEX_DIR" \
            --out "$RUN_DIR/all-curator-tasks.jsonl" \
            > "$REDACTED_DIR/task-build-report.json"

      - name: Select deterministic task chunk
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from benchmark_campaign.core import sha256_file
          from benchmark_campaign.post_consolidation import validate_reserve_activation

          root = Path(".").resolve()
          run = Path(os.environ["RUN_DIR"])
          rows = [
              json.loads(line)
              for line in (run / "all-curator-tasks.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          offset = int(os.environ["TASK_OFFSET"])
          limit = int(os.environ["TASK_LIMIT"])
          scope = os.environ["TASK_SCOPE"]
          activation_sha256 = None

          if scope == "primary":
              selected = rows[offset:offset + limit]
              if any(row.get("candidate_slot_kind") == "reserve" for row in selected):
                  raise SystemExit("primary selection crossed into reserve candidate surface")
          elif scope == "approved_reserve":
              status = json.loads(
                  (root / "artifacts" / "H3.9.2-STATUS.json").read_text(encoding="utf-8")
              )
              approved = status["reserve_activation"]
              activation_path = root / approved["evidence_path"]
              activation = validate_reserve_activation(root, activation_path, [])
              activation_sha256 = sha256_file(activation_path)
              activated_ids = sorted(
                  str(row["reserve_slot_id"]) for row in activation["activated"]
              )
              selected_ids = activated_ids[offset:offset + limit]
              by_id = {str(row["task_id"]): row for row in rows}
              if len(by_id) != len(rows):
                  raise SystemExit("factory task set contains duplicate task IDs")
              missing = [task_id for task_id in selected_ids if task_id not in by_id]
              if missing:
                  raise SystemExit(f"activated reserve tasks missing from Factory output: {missing}")
              selected = [by_id[task_id] for task_id in selected_ids]
              validate_reserve_activation(root, activation_path, selected)
              if any(row.get("candidate_slot_kind") != "reserve" for row in selected):
                  raise SystemExit("approved reserve selection contains a non-reserve task")
          else:
              raise SystemExit("unsupported TASK_SCOPE")

          if len(selected) != limit:
              raise SystemExit("selected task count differs from requested chunk size")

          out = run / "curator-tasks.jsonl"
          with out.open("w", encoding="utf-8", newline="\n") as fh:
              for row in selected:
                  fh.write(json.dumps(row, ensure_ascii=False, sort_keys=True) + "\n")
          summary = {
              "task_scope": scope,
              "task_offset": offset,
              "task_limit": limit,
              "selected_task_count": len(selected),
              "selected_tasks_sha256": hashlib.sha256(out.read_bytes()).hexdigest(),
              "reserve_activation_sha256": activation_sha256,
          }
          (Path(os.environ["REDACTED_DIR"]) / "chunk.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          rm "$RUN_DIR/all-curator-tasks.jsonl"

      - name: Create protected execution configs
        env:
          CURATOR_ENDPOINT: ${{ secrets.H392_CURATOR_ENDPOINT }}
          VERIFIER_ENDPOINT: ${{ secrets.H392_VERIFIER_ENDPOINT }}
          CURATOR_MODEL_FAMILY: ${{ secrets.H392_CURATOR_MODEL_FAMILY }}
          CURATOR_MODEL_REF: ${{ secrets.H392_CURATOR_MODEL_REF }}
          VERIFIER_MODEL_FAMILY: ${{ secrets.H392_VERIFIER_MODEL_FAMILY }}
          VERIFIER_MODEL_REF: ${{ secrets.H392_VERIFIER_MODEL_REF }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = Path(os.environ["RUN_DIR"])
          adapter = "adapters/chat_completions.py"

          def config(role, family, model, base_url, auth_style, json_mode):
              return {
                  "schema_version": 1,
                  "role": role,
                  "model_family": family,
                  "model_ref": model,
                  "adapter": {
                      "command": [
                          "python", adapter,
                          "--input", "{input}",
                          "--output", "{output}",
                          "--index", "{index_dir}",
                          "--contract", "{contract}",
                          "--base-url", base_url,
                          "--auth-style", auth_style,
                          "--json-mode", json_mode,
                          "--stream",
                          "--timeout", "600",
                          "--max-evidence-sources", "12",
                          "--max-excerpt-chars", "1800",
                      ],
                      "env_allowlist": ["MUBIN_MODEL_API_KEY"],
                      "artifacts": [adapter],
                  },
                  "batch_size": 1,
                  "timeout_seconds": 660,
                  "max_attempts": 2,
                  "task_failure_policy": "record_rejection",
              }

          curator = config(
              "curator",
              os.environ["CURATOR_MODEL_FAMILY"],
              os.environ["CURATOR_MODEL_REF"],
              os.environ["CURATOR_ENDPOINT"],
              os.environ["CURATOR_AUTH_STYLE"],
              os.environ["CURATOR_JSON_MODE"],
          )
          verifier = config(
              "verifier",
              os.environ["VERIFIER_MODEL_FAMILY"],
              os.environ["VERIFIER_MODEL_REF"],
              os.environ["VERIFIER_ENDPOINT"],
              os.environ["VERIFIER_AUTH_STYLE"],
              os.environ["VERIFIER_JSON_MODE"],
          )
          for name, value in (("curator-config.json", curator), ("verifier-config.json", verifier)):
              (run / name).write_text(
                  json.dumps(value, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Run Curator AI-A
        env:
          MUBIN_MODEL_API_KEY: ${{ secrets.H392_CURATOR_API_KEY }}
        run: |
          python -m benchmark_campaign factory-run-agent \
            --role curator \
            --tasks "$RUN_DIR/curator-tasks.jsonl" \
            --index-dir "$INDEX_DIR" \
            --config "$RUN_DIR/curator-config.json" \
            --out "$RUN_DIR/curator-responses.jsonl" \
            --manifest "$RUN_DIR/curator-run.json" \
            > /dev/null

      - name: Prepare structurally blind Verifier tasks
        id: verifier_tasks
        run: |
          python -m benchmark_campaign factory-prepare-verifier \
            --partition non_holdout \
            --tasks "$RUN_DIR/curator-tasks.jsonl" \
            --curator-responses "$RUN_DIR/curator-responses.jsonl" \
            --out "$RUN_DIR/verifier-tasks.jsonl" \
            > "$REDACTED_DIR/verifier-task-report.json"
          count="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["REDACTED_DIR"],"verifier-task-report.json")))["verifier_tasks"])')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Run independent Verifier AI-B
        if: steps.verifier_tasks.outputs.count != '0'
        env:
          MUBIN_MODEL_API_KEY: ${{ secrets.H392_VERIFIER_API_KEY }}
        run: |
          python -m benchmark_campaign factory-run-agent \
            --role verifier \
            --tasks "$RUN_DIR/verifier-tasks.jsonl" \
            --index-dir "$INDEX_DIR" \
            --config "$RUN_DIR/verifier-config.json" \
            --out "$RUN_DIR/verifier-responses.jsonl" \
            --manifest "$RUN_DIR/verifier-run.json" \
            --independent-from-manifest "$RUN_DIR/curator-run.json" \
            > /dev/null

      - name: Materialize empty Verifier response set when Curator found no candidates
        if: steps.verifier_tasks.outputs.count == '0'
        run: |
          : > "$RUN_DIR/verifier-responses.jsonl"

      - name: Reconcile source evidence and policy gates
        run: |
          set -eu
          mkdir -p "$RUN_DIR/reviewed"
          extra=()
          if [ "$TASK_SCOPE" = "approved_reserve" ]; then
            activation_path="$(python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(
              (Path("artifacts") / "H3.9.2-STATUS.json").read_text(encoding="utf-8")
          )
          print(status["reserve_activation"]["evidence_path"])
          PY
          )"
            extra+=(--reserve-activation "$activation_path")
          fi
          python -m benchmark_campaign factory-reconcile \
            --partition non_holdout \
            --tasks "$RUN_DIR/curator-tasks.jsonl" \
            --curator-responses "$RUN_DIR/curator-responses.jsonl" \
            --verifier-responses "$RUN_DIR/verifier-responses.jsonl" \
            --source-cache-dir "$CACHE_DIR" \
            --reviewed-dir "$RUN_DIR/reviewed" \
            --adjudication-out "$RUN_DIR/adjudication.jsonl" \
            --ledger-out "$RUN_DIR/CURATION_LEDGER.jsonl" \
            "${extra[@]}" \
            > "$REDACTED_DIR/reconcile-report.json"

      - name: Build redacted run summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          run = Path(os.environ["RUN_DIR"])
          redacted = Path(os.environ["REDACTED_DIR"])

          def load(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def response_counts(path):
              counts = {"candidate": 0, "no_candidate": 0}
              if not path.exists():
                  return counts
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  status = json.loads(line).get("status")
                  if status in counts:
                      counts[status] += 1
              return counts

          curator = load(run / "curator-run.json")
          verifier_path = run / "verifier-run.json"
          verifier = load(verifier_path) if verifier_path.exists() else None
          verifier_preparation = load(redacted / "verifier-task-report.json")
          reconcile = load(redacted / "reconcile-report.json")
          readiness = load(redacted / "READINESS_GATE.json")
          chunk = load(redacted / "chunk.json")
          summary = {
              "schema_version": 1,
              "campaign_id": "H3.9.2",
              "kind": "non_holdout_curator_verifier_chunk",
              "github_sha": os.environ.get("GITHUB_SHA"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              **chunk,
              "readiness": readiness,
              "curator": {
                  "config_sha256": curator["config_sha256"],
                  "adapter_artifacts": curator["adapter_artifacts"],
                  "attempted_task_count": curator["attempted_task_count"],
                  "completed_task_count": curator["completed_task_count"],
                  "rejected_task_count": curator["rejected_task_count"],
                  "pending_task_count": curator["pending_task_count"],
                  "rejection_counts": curator["rejection_counts"],
                  "response_counts": response_counts(run / "curator-responses.jsonl"),
                  "output_sha256": curator["output_sha256"],
              },
              "verifier_preparation": verifier_preparation,
              "verifier": ({
                  "config_sha256": verifier["config_sha256"],
                  "adapter_artifacts": verifier["adapter_artifacts"],
                  "attempted_task_count": verifier["attempted_task_count"],
                  "completed_task_count": verifier["completed_task_count"],
                  "rejected_task_count": verifier["rejected_task_count"],
                  "pending_task_count": verifier["pending_task_count"],
                  "rejection_counts": verifier["rejection_counts"],
                  "response_counts": response_counts(run / "verifier-responses.jsonl"),
                  "output_sha256": verifier["output_sha256"],
                  "independent_curator_manifest_sha256": verifier["independent_curator_manifest_sha256"],
              } if verifier is not None else {
                  "attempted_task_count": 0,
                  "completed_task_count": 0,
                  "rejected_task_count": 0,
                  "pending_task_count": 0,
                  "rejection_counts": {},
                  "response_counts": {"candidate": 0, "no_candidate": 0},
                  "not_run_reason": "no_curator_candidates",
              }),
              "reconciliation": reconcile,
              "contains_source_text": False,
              "contains_gold_payloads": False,
              "source_bearing_bundle_encrypted": True,
          }
          (redacted / "CURATION_RUN_SUMMARY.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Encrypt all source-bearing run evidence
        env:
          ARTIFACT_KEY: ${{ secrets.H392_CURATION_ARTIFACT_KEY }}
        run: |
          set -eu
          tar -C "$RUN_DIR" -czf /tmp/h392-curation-source-bearing.tar.gz .
          python -m benchmark_campaign.artifact_crypto encrypt \
            --input /tmp/h392-curation-source-bearing.tar.gz \
            --output "$REDACTED_DIR/h392-curation-source-bearing.tar.gz.aesgcm" \
            --passphrase-env ARTIFACT_KEY
          sha256sum "$REDACTED_DIR/h392-curation-source-bearing.tar.gz.aesgcm" \
            | awk '{print $1}' > "$REDACTED_DIR/ENCRYPTED_BUNDLE_SHA256.txt"
          rm -f /tmp/h392-curation-source-bearing.tar.gz

      - name: Prove no plaintext source-bearing files enter the artifact
        run: |
          set -eu
          test ! -e "$REDACTED_DIR/curator-responses.jsonl"
          test ! -e "$REDACTED_DIR/verifier-responses.jsonl"
          test ! -e "$REDACTED_DIR/verifier-tasks.jsonl"
          test ! -e "$REDACTED_DIR/curator-tasks.jsonl"
          test ! -e "$REDACTED_DIR/segments.jsonl"
          test -s "$REDACTED_DIR/h392-curation-source-bearing.tar.gz.aesgcm"

      - name: Upload encrypted curation bundle and redacted summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h392-curation-chunk-${{ inputs.task_offset }}-${{ inputs.task_limit }}
          path: /tmp/h392-curation/redacted
          if-no-files-found: error
          retention-days: 30
