name: Mubin operator workspace I0.1b synthetic verification

on:
  pull_request:
    paths:
      - "engines/quran/research/workspace.py"
      - "engines/quran/research/pinned_session.py"
      - "qa/corpus_snapshot_v01.py"
      - "qa/private_evidence_v01.py"
      - "engines/quran/research/private_adapters.py"
      - "engines/quran/research/operator_view.py"
      - "engines/quran/research/qualification.py"
      - "core/tests/test_quran_operator_workspace_i01b.py"
      - "core/tests/test_quran_pinned_workspace_i01c1.py"
      - ".github/workflows/mubin-operator-workspace.yml"
      - "docs/research/QURAN-I01B-UNIFIED-EXPERIENCE.md"
      - "docs/research/QURAN-I01C1-PINNED-WORKSPACE.md"
  push:
    branches: [main]
    paths:
      - "engines/quran/research/workspace.py"
      - "engines/quran/research/pinned_session.py"
      - "qa/corpus_snapshot_v01.py"
      - "qa/private_evidence_v01.py"
      - "engines/quran/research/private_adapters.py"
      - "engines/quran/research/operator_view.py"
      - "engines/quran/research/qualification.py"
      - "core/tests/test_quran_operator_workspace_i01b.py"
      - "core/tests/test_quran_pinned_workspace_i01c1.py"
      - ".github/workflows/mubin-operator-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-workspace-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Offline synthetic-only workspace security tests
        run: python -m unittest core.tests.test_quran_operator_workspace_i01b core.tests.test_quran_pinned_workspace_i01c1 -v
      - name: Compile workspace server
        run: python -m compileall -q engines/quran/research/workspace.py engines/quran/research/pinned_session.py qa/benchmark_pinned_workspace_i01c1.py

# No real vault, keys, permits, or scripture content in CI.