name: Mubin private corpus import synthetic-only contract tests

on:
  pull_request:
    paths:
      - "qa/corpus_ingest_v01.py"
      - "core/tests/test_corpus_ingest_v01.py"
      - "research/corpora/import-sources-v01.json"
      - "research/corpora/acquisition-backlog-v01.json"
      - "docs/research/PRIVATE-CORPUS-IMPORT-V01.md"
      - "docs/reviews/PRIVATE-CORPUS-IMPORT-R1-AUDIT.md"
      - ".github/workflows/mubin-private-corpus-import.yml"
  push:
    branches: [main]
    paths:
      - "qa/corpus_ingest_v01.py"
      - "core/tests/test_corpus_ingest_v01.py"
      - "research/corpora/import-sources-v01.json"
      - ".github/workflows/mubin-private-corpus-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-synthetic-ingestion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Synthetic-only complete-data, footnote, digest, atomicity and license-state tests
        run: python -m unittest core.tests.test_corpus_ingest_v01 -v
      - name: Compile private importer; do not execute downloader
        run: python -m compileall -q qa/corpus_ingest_v01.py

# Never download actual Quran/Tafsir source files in CI; do not upload artifacts.
# Authorized operator alone may explicitly choose --download on private machine.
