name: Mubin Usul U0.1 synthetic + U0.2 source + U0.3 questions

on:
  pull_request:
    paths:
      - "core/usul/**"
      - "core/tests/test_usul_u01.py"
      - "core/tests/test_usul_u02.py"
      - "core/tests/test_usul_u03.py"
      - "research/usul/**"
      - "schemas/usul-u01-**"
      - "schemas/usul-u02-**"
      - "schemas/usul-u03-**"
      - "docs/research/USUL-U01-**"
      - "docs/research/USUL-U02-**"
      - "docs/research/USUL-U03-**"
      - "docs/reviews/USUL-U01-**"
      - "docs/reviews/USUL-U02-**"
      - "docs/reviews/USUL-U03-**"
      - ".github/workflows/mubin-usul-synthetic.yml"
  push:
    branches: [main]
    paths:
      - "core/usul/**"
      - "core/tests/test_usul_u01.py"
      - "core/tests/test_usul_u02.py"
      - "core/tests/test_usul_u03.py"
      - "research/usul/**"
      - "schemas/usul-u01-**"
      - "schemas/usul-u02-**"
      - "schemas/usul-u03-**"
      - "docs/research/USUL-U01-**"
      - "docs/research/USUL-U02-**"
      - "docs/research/USUL-U03-**"
      - "docs/reviews/USUL-U01-**"
      - "docs/reviews/USUL-U02-**"
      - "docs/reviews/USUL-U03-**"
      - ".github/workflows/mubin-usul-synthetic.yml"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q core/usul core/tests
      - run: python -m unittest discover -s core/tests -v
      - run: python -m core.usul research/usul/rulebook-synthetic.json research/usul/test-cases-synthetic.json --json
      - run: python -m core.usul.docket_cli research/usul/u02-risala-source-candidates.json --json
      - run: python -m core.usul.claims_cli research/usul/u03-risala-hypothesis-cards.json research/usul/u02-risala-source-candidates.json --json
