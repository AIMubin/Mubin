name: Mubin governance policy template tests

on:
  pull_request:
    paths:
      - 'docs/governance/**'
      - 'qa/tests/test_main_ruleset_templates.py'
      - '.github/workflows/governance-template-checks.yml'
  push:
    branches: [main]
    paths:
      - 'docs/governance/**'
      - 'qa/tests/test_main_ruleset_templates.py'
      - '.github/workflows/governance-template-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruleset-templates:
    name: Validate staged ruleset templates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify both ruleset imports without contacting GitHub
        run: python -m unittest qa.tests.test_main_ruleset_templates -v
