name: Mubin B02-B research handoff metadata integrity

on:
  pull_request:
    paths:
      - 'research/b02b/**'
      - 'qa/check_b02b_handoff.py'
      - 'qa/tests/test_b02b_handoff.py'
      - 'qa/check_b02c2_replay.py'
      - 'qa/tests/test_b02c2_replay.py'
      - '.github/workflows/b02b-handoff-metadata.yml'
  push:
    branches: [main]
    paths:
      - 'research/b02b/**'
      - 'qa/check_b02b_handoff.py'
      - 'qa/tests/test_b02b_handoff.py'
      - 'qa/check_b02c2_replay.py'
      - 'qa/tests/test_b02c2_replay.py'
      - '.github/workflows/b02b-handoff-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r core/requirements-test.txt
      - name: Test metadata gate negative cases
        run: python -m unittest qa.tests.test_b02b_handoff -v
      - name: Verify handoff when supplied by checkout
        run: python -m qa.check_b02b_handoff --if-present
      - name: Test B02-C.2 source-bound metadata invariants
        run: python -m unittest qa.tests.test_b02c2_replay -v
      - name: Verify B02-C.2 replay when supplied by checkout
        run: python -m qa.check_b02c2_replay --if-present

# This CI has no access to the private Waraqat/Tafsir/Hadith sources or model
# review receipts and never claims to authenticate them.
