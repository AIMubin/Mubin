name: Mubin Quran Q0.1 offline snapshot lookup

on:
  pull_request:
    paths:
      - "engines/quran/**"
      - "core/tests/test_quran_q01.py"
      - "schemas/quran-q01-**"
      - "docs/research/QURAN-Q01-**"
      - "docs/reviews/QURAN-Q01-**"
      - ".github/workflows/mubin-quran-q01.yml"
  push:
    branches: [main]
    paths:
      - "engines/quran/**"
      - "core/tests/test_quran_q01.py"
      - "schemas/quran-q01-**"
      - "docs/research/QURAN-Q01-**"
      - "docs/reviews/QURAN-Q01-**"
      - ".github/workflows/mubin-quran-q01.yml"

permissions:
  contents: read

jobs:
  quran-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q engines/quran/q01 core/tests
      - run: python -m unittest discover -s core/tests -v
      - run: python -m engines.quran.q01 --manifest engines/quran/fixtures/q01-manifest-synthetic.json --corpus engines/quran/fixtures/q01-verses-synthetic.json --json verify
      - run: python -m engines.quran.q01 --manifest engines/quran/fixtures/q01-manifest-synthetic.json --corpus engines/quran/fixtures/q01-verses-synthetic.json --json get 1:1
      - run: python -m engines.quran.q01 --manifest engines/quran/fixtures/q01-manifest-synthetic.json --corpus engines/quran/fixtures/q01-verses-synthetic.json --json find 'سلام' --match arabic_marks_insensitive
