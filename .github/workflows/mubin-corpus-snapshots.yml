name: Mubin corpus evidence snapshots I0.1c verification

on:
  pull_request:
    paths:
      - "qa/corpus_snapshot_v01.py"
      - "core/tests/test_corpus_snapshots_i01c.py"
      - ".github/workflows/mubin-corpus-snapshots.yml"
  push:
    branches: [main]
    paths:
      - "qa/corpus_snapshot_v01.py"
      - "core/tests/test_corpus_snapshots_i01c.py"
      - ".github/workflows/mubin-corpus-snapshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-snapshot-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Offline synthetic-only immutability and pinning tests
        run: python -m unittest core.tests.test_corpus_snapshots_i01c -v
      - name: Compile snapshot module
        run: python -m compileall -q qa/corpus_snapshot_v01.py

# No real vault, keys, or scripture content in CI.