name: Mubin Quran Q0.1e-b pinned live loopback reader

on:
  pull_request:
    paths:
      - "engines/quran/q01e/**"
      - "engines/quran/q01c/reader.py"
      - "engines/quran/q01c/reader.js"
      - "engines/quran/tafsir/catalog.py"
      - "core/tests/test_quran_q01e.py"
      - "core/tests/test_quran_tafsir_metadata.py"
      - "docs/research/QURAN-Q01E-DIRECT-READER.md"
      - "docs/reviews/QURAN-Q01E-DIRECT-READER-AUDIT.md"
      - ".github/workflows/mubin-quran-q01e-reader.yml"
  push:
    branches: [main]
    paths:
      - "engines/quran/q01e/**"
      - "engines/quran/q01c/reader.py"
      - "engines/quran/q01c/reader.js"
      - "engines/quran/tafsir/catalog.py"
      - "core/tests/test_quran_q01e.py"
      - "core/tests/test_quran_tafsir_metadata.py"
      - ".github/workflows/mubin-quran-q01e-reader.yml"

permissions:
  contents: read

jobs:
  direct-reader-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q engines/quran/q01e engines/quran/q01c engines/quran/tafsir
      - run: python -m unittest core.tests.test_quran_q01e core.tests.test_quran_q01c core.tests.test_quran_tafsir_metadata -v
      - run: node --check engines/quran/q01c/reader.js

  direct-reader-full-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m unittest discover -s core/tests -v

  observed-domain-reader-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Attempt source-HTTPS exact-byte local-read (NOT A PASS GATE)
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, threading
          from urllib.request import urlopen
          from engines.quran.q01e.official import obtain_official_index
          from engines.quran.q01c.reader import build_http_server
          idx,raw=obtain_official_index()
          assert idx.report()["source_authenticated"] is False
          assert idx.report()["rights_verified"] is False
          assert len(idx.verses)==6236
          server=build_http_server(idx,raw,port=0)
          thread=threading.Thread(target=server.serve_forever,daemon=True)
          thread.start()
          try:
              with urlopen(f"http://127.0.0.1:{server.server_port}/api/status",timeout=10) as resp:
                  status=json.load(resp)
              assert status["source_kind"]=="tanzil_domain_unattested_export"
              assert status["source_authenticated"] is False
              assert status["official_tanzil_bytes_independently_verified"] is False
              with urlopen(f"http://127.0.0.1:{server.server_port}/api/tafsir-catalog?ref=2%3A1",timeout=10) as resp:
                  meta=json.load(resp)
              assert meta["reference"]=="2:1"
              assert len(meta["sources"])==6
              assert meta["text_import_allowed"] is False
              assert meta["rights_verified"] is False
              assert meta["p1_admitted"] is False
              print("Q01E_LIVE_READER_PASS: pinned bytes / localhost only / six unverified metadata titles")
              print(json.dumps({"candidate_sha256":idx.raw_sha256,
                                "verse_count":status["verse_count"],
                                "source_authenticated":False,
                                "rights_verified":False},sort_keys=True))
          finally:
              server.shutdown()
              server.server_close()
              thread.join(timeout=3)
          PY
