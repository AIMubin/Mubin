name: Hadith H3.9.2 integrity

on:
  pull_request:
    paths:
      - "engines/hadith/qualification/H3.9.2/**"
      - ".github/workflows/hadith-h392.yml"
      - ".github/workflows/h392-curation-pilot.yml"
      - ".github/workflows/h392-curation-campaign.yml"
      - ".github/workflows/h392-nonholdout-acquisition.yml"
      - ".github/workflows/h392-cumulative-consolidation.yml"
      - ".github/workflows/h392-reserve-activation.yml"
      - ".github/workflows/h392-reserve-campaign.yml"
      - ".github/workflows/h392-reserve-consolidation.yml"
      - ".github/workflows/h392-capacity-extension.yml"
      - ".github/workflows/h392-reserve2-campaign.yml"
      - ".github/workflows/h392-reserve2-consolidation.yml"
      - ".github/workflows/h392-adjudication-packet.yml"
      - ".github/workflows/h392-schema31-decision-template.yml"
  push:
    branches: [main, "bootstrap/**", "h392/**"]
    paths:
      - "engines/hadith/qualification/H3.9.2/**"
      - ".github/workflows/hadith-h392.yml"
      - ".github/workflows/h392-curation-pilot.yml"
      - ".github/workflows/h392-curation-campaign.yml"
      - ".github/workflows/h392-nonholdout-acquisition.yml"
      - ".github/workflows/h392-cumulative-consolidation.yml"
      - ".github/workflows/h392-reserve-activation.yml"
      - ".github/workflows/h392-reserve-campaign.yml"
      - ".github/workflows/h392-reserve-consolidation.yml"
      - ".github/workflows/h392-capacity-extension.yml"
      - ".github/workflows/h392-reserve2-campaign.yml"
      - ".github/workflows/h392-reserve2-consolidation.yml"
      - ".github/workflows/h392-adjudication-packet.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/hadith/qualification/H3.9.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engines/hadith/qualification/H3.9.2/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q benchmark_campaign adapters tests
      - run: python -m unittest discover -s tests -v
