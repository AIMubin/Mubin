name: Mubin Quran Q0.1d offline unverified candidate comparison

on:
  pull_request:
    paths:
      - "engines/quran/q01d/**"
      - "core/tests/test_quran_q01d.py"
      - "docs/research/QURAN-Q01D-**"
      - "docs/reviews/QURAN-Q01D-**"
      - ".github/workflows/mubin-quran-q01d.yml"
  push:
    branches: [main]
    paths:
      - "engines/quran/q01d/**"
      - "core/tests/test_quran_q01d.py"
      - "docs/research/QURAN-Q01D-**"
      - "docs/reviews/QURAN-Q01D-**"
      - ".github/workflows/mubin-quran-q01d.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-unverified-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q engines/quran/q01d core/tests
      - run: python -m unittest discover -s core/tests -v
      - name: Pinned mirror SELF-COMPARISON ONLY (not publisher attestation)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --max-time 45 --max-filesize 4194304 \
            'https://raw.githubusercontent.com/acfatah/tanzil/052b515f3a24dfacbe4cafc3b89f0681a447f462/data/quran-uthmani.txt' \
            --output "${RUNNER_TEMP}/q01d-unverified-mirror.txt"
          python -m engines.quran.q01d \
            --manifest engines/quran/q01b/sources/tanzil-mirror-v1.1.json \
            --mirror "${RUNNER_TEMP}/q01d-unverified-mirror.txt" \
            --candidate "${RUNNER_TEMP}/q01d-unverified-mirror.txt" \
            --json > "${RUNNER_TEMP}/q01d-comparison.json"
          python - "${RUNNER_TEMP}/q01d-comparison.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: r=json.load(f)
          assert r['comparison']=='byte_identical'
          assert r['candidate_verse_count']==6236
          for flag in ('source_authenticated','candidate_publisher_provenance_verified',
                       'official_candidate_attested','rights_verified','eligible_for_religious_ruling'):
              assert r[flag] is False
          print(json.dumps({k:r[k] for k in ('comparison','candidate_verse_count',
                           'candidate_sha256','candidate_publisher_provenance_verified')},sort_keys=True))
          PY

  windows-synthetic-comparison:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q engines/quran/q01d core/tests/test_quran_q01d.py
      - run: python -m unittest core.tests.test_quran_q01d -v
