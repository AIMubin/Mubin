name: Mubin P0 inference foundation

on:
  pull_request:
    paths:
      - "VERSION.yaml"
      - "core/**"
      - "schemas/**"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
      - "docs/INFERENCE_CONTRACTS.md"
      - "docs/reviews/**"
      - "docs/REVIEW_POLICY.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/mubin-inference-foundation.yml"
  push:
    branches: [main, "p0/**", "p0-*"]
    paths:
      - "VERSION.yaml"
      - "core/**"
      - "schemas/**"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
      - "docs/INFERENCE_CONTRACTS.md"
      - "docs/reviews/**"
      - "docs/REVIEW_POLICY.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/mubin-inference-foundation.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements-test.txt
      - run: python -m pip install -r core/requirements-test.txt
      - run: python -m compileall -q core/inference core/tests
      - run: python -m core.inference --help
      - run: python -m unittest discover -s core/tests -v
